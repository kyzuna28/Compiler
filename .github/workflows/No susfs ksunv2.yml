# ============================================================
# Kyzuna Universal Kernel Builder
# Customized for Poco F1 (beryllium)
# ============================================================

name: Build Final

run-name: >-
  🚀 ${{ inputs.zip_name }}
  | ${{ inputs.kernel-config }}
  | ${{ inputs.kernel_name }}
  | ${{ inputs.rom_type }}
  | ${{ inputs.compiler_mode }}
  | ${{ inputs.compiler }}
  | ${{ inputs.lto_mode }}
  | ${{ inputs.kernel-branch }}
  | ${{ inputs.kernelsu }}

on:
  workflow_dispatch:
    inputs:

      # ========================================================
      # BASIC
      # ========================================================

      zip_name:
        description: 'Zip Output Name'
        required: true
        type: string

      ubuntu:
        description: 'Ubuntu Version'
        default: 'ubuntu-24.04'
        required: true
        type: string

      project_name:
        description: 'Project Name / Build User'
        default: 'selea×kyy'
        required: true
        type: string

      kernel_name:
        description: 'Kernel Name (none = preserve source)'
        default: 'none'
        required: true
        type: string

      rom_type:
        description: 'ROM Type (AOSP / MIUI / Lineage / none)'
        default: 'none'
        required: true
        type: string

      # ========================================================
      # COMPILER
      # ========================================================

      compiler_mode:
        description: 'Compiler Mode'
        default: 'auto'
        required: true
        type: choice
        options:
          - auto
          - clang
          - gcc

      compiler:
        description: 'Compiler Toolchain'
        default: 'aosp-clang'
        required: true
        type: choice
        options:
          - zyc-clang
          - yuki-clang
          - weebx-clang
          - neutron-clang
          - aosp-clang
          - debian-clang
          - system-clang
          - system-gcc

      custom_compiler_name_enable:
        description: 'Enable Custom Compiler Name'
        default: false
        required: true
        type: boolean

      custom_compiler_name:
        description: 'Custom Compiler Name'
        default: 'Custom Clang'
        required: false
        type: string

      llvm_ias:
        description: 'LLVM Integrated Assembler (auto recommended)'
        default: 'auto'
        required: true
        type: choice
        options:
          - auto
          - enabled
          - disabled

      # ========================================================
      # KERNEL CONFIG
      # ========================================================

      kernel-config:
        description: 'Kernel Config (defconfig / vendor config)'
        default: 'defconfig'
        required: true
        type: string

      merge_config:
        description: 'Merge Config Fragments'
        default: false
        required: true
        type: boolean

      extra_config:
        description: 'Extra Config (cth: DEBUG_FS,-PREEMPT)'
        default: 'none'
        required: false
        type: string

      # ========================================================
      # OPTIMIZATION
      # ========================================================

      lto_mode:
        description: 'LTO Optimization'
        default: 'no lto'
        required: true
        type: choice
        options:
          - 'no lto'
          - full
          - thin

      # ========================================================
      # ROOT / KSU
      # ========================================================

      kernelsu:
        description: 'Root Method / KernelSU Fork'
        default: 'none'
        required: true
        type: choice
        options:
          - 'none'
          - apatch
          - sorayukii
          - mr-morat
          - enjoy
          - legacy
          - sukisu
          - next
          - resukisu
          - thre

      susfs_enable:
        description: 'Enable SuSFS'
        default: false
        required: true
        type: boolean

      # ========================================================
      # CUSTOM PATCHES
      # ========================================================

      custom_tweaks:
        description: '1. Pre-KSU .sh/.patch (comma separated)'
        default: 'none'
        required: false
        type: string

      susfs_custom:
        description: '2. SuSFS .sh/.patch (comma separated)'
        default: 'none'
        required: false
        type: string

      custom_hooks:
        description: '3. Custom Hook .sh/.patch (comma separated)'
        default: 'none'
        required: false
        type: string

      # ========================================================
      # VERSION
      # ========================================================

      version_hash:
        description: 'Include Git Version Hash'
        default: 'no hash'
        required: true
        type: choice
        options:
          - 'no hash'
          - hash

      # ========================================================
      # SOURCE
      # ========================================================

      kernel-url:
        description: 'Kernel Source URL'
        default: 'https://github.com/kyzuna28/bka.git'
        required: true
        type: string

      kernel-branch:
        description: 'Kernel Source Branch'
        default: 'nse'
        required: true
        type: string

      anykernel-url:
        description: 'AnyKernel3 Repository URL'
        default: 'https://github.com/kyzuna28/AnyKernel3.git'
        required: true
        type: string


# ==============================================================
# JOBS
# ==============================================================

jobs:

  build:

    runs-on: ${{ inputs.ubuntu }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      REPO_RAW: 'https://raw.githubusercontent.com/kyzuna28/Compiler/main'

      REPO_API: 'https://api.github.com/repos/kyzuna28/Compiler/git/trees/main?recursive=1'


    # ==========================================================
    # STEPS
    # ==========================================================

    steps:


      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: 🧹 Clean Environment & Install Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta

          echo "=========================================="
          echo "CLEANING GITHUB RUNNER"
          echo "=========================================="

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune -af || true

          echo "=========================================="
          echo "INSTALLING BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install \
            --no-install-recommends \
            -y \
            build-essential \
            gcc \
            g++ \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi \
            binutils \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            clang \
            llvm \
            lld \
            make \
            bc \
            bison \
            flex \
            cpio \
            kmod \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            libncurses5-dev \
            libncurses6 \
            libtinfo-dev \
            libdw-dev \
            libunwind-dev \
            dwarves \
            pahole \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pip \
            perl \
            libperl-dev \
            libdata-dump-perl \
            rsync \
            git \
            git-lfs \
            curl \
            wget \
            aria2 \
            patch \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            zstd \
            lz4 \
            zip \
            unzip \
            device-tree-compiler \
            u-boot-tools \
            openssl \
            pkg-config \
            software-properties-common \
            gnupg \
            lsb-release

          if [[ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]]; then
            sudo ln -sf \
              /lib/x86_64-linux-gnu/libtinfo.so.6 \
              /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

          echo "=========================================="
          echo "DEPENDENCIES READY"
          echo "=========================================="


      # ========================================================
      # SWAP
      # ========================================================

      - name: 💽 Setup Dynamic Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true

          if [[ "${{ inputs.lto_mode }}" == "full" ]]; then
            SWAP_SIZE="16G"
          else
            SWAP_SIZE="8G"
          fi

          echo "💽 Swap Size: $SWAP_SIZE"

          sudo fallocate \
            -l "$SWAP_SIZE" \
            /mnt/swapfile

          sudo chmod 600 /mnt/swapfile

          sudo mkswap /mnt/swapfile

          sudo swapon /mnt/swapfile

          free -h


      # ========================================================
      # CLONE KERNEL
      # ========================================================

      - name: 📂 Clone Kernel Source
        run: |
          echo "=========================================="
          echo "CLONING KERNEL"
          echo "=========================================="

          git clone \
            --depth=1 \
            -b "${{ inputs.kernel-branch }}" \
            "${{ inputs.kernel-url }}" \
            kernel-dir

          cd kernel-dir

          git submodule update \
            --init \
            --recursive || true

          echo ""
          echo "Kernel source:"
          git remote -v

          echo ""
          echo "Kernel commit:"
          git log -1 --oneline


      # ========================================================
      # TOOLCHAIN
      # ========================================================

      - name: 🛠️ Download & Prepare Toolchain
        run: |
          set -e

          rm -rf "$HOME/tc"

          mkdir -p \
            "$HOME/tc" \
            "$HOME/tc/bin"

          cd "$HOME"

          COMPILER="${{ inputs.compiler }}"

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="
          echo "Requested : $COMPILER"
          echo "Mode      : ${{ inputs.compiler_mode }}"
          echo "=========================================="

          case "$COMPILER" in

            zyc-clang)

              git clone \
                --depth=1 \
                -b 21 \
                https://gitlab.com/clangsantoni/zyc_clang.git \
                tc

              ;;

            yuki-clang)

              git clone \
                --depth=1 \
                -b 18.0.0 \
                https://gitlab.com/TheXPerienceProject/yuki_clang.git \
                tc

              ;;

            weebx-clang)

              curl -fsSL \
                'https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz' |
                tar -xz \
                -C tc

              ;;

            neutron-clang)

              cd tc

              curl -fsSLO \
                'https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman'

              chmod +x antman

              ./antman -S=10032024

              ;;

            aosp-clang)

              rm -rf "$HOME/tc"

              git clone \
                --depth=1 \
                -b 15.0 \
                https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
                "$HOME/tc"

              ;;

            debian-clang)

              wget -qO- \
                https://apt.llvm.org/llvm.sh |
                sudo bash -s 21

              sudo apt-get install \
                --no-install-recommends \
                -y \
                clang-21 \
                lld-21 \
                llvm-21

              mkdir -p "$HOME/tc/bin"

              cat > "$HOME/tc/bin/clang" <<'EOF'
          #!/bin/bash

          if [[ "$1" == "--version" || "$1" == "-v" ]]; then
            echo "Debian clang version 21.1.8"
            echo "Target: aarch64-unknown-linux-gnu"
            exit 0
          fi

          exec /usr/bin/clang-21 "$@"
          EOF

              cat > "$HOME/tc/bin/clang++" <<'EOF'
          #!/bin/bash
          exec /usr/bin/clang++-21 "$@"
          EOF

              cat > "$HOME/tc/bin/ld.lld" <<'EOF'
          #!/bin/bash

          if [[ "$1" == "--version" || "$1" == "-v" ]]; then
            echo "Debian LLD 21.1.8"
            exit 0
          fi

          exec /usr/bin/ld.lld-21 "$@"
          EOF

              chmod +x \
                "$HOME/tc/bin/clang" \
                "$HOME/tc/bin/clang++" \
                "$HOME/tc/bin/ld.lld"

              for tool in \
                ar \
                nm \
                objcopy \
                objdump \
                readelf \
                strip; do

                if [[ -x "/usr/bin/llvm-$tool-21" ]]; then
                  ln -sf \
                    "/usr/bin/llvm-$tool-21" \
                    "$HOME/tc/bin/llvm-$tool"
                fi

              done

              ;;

            system-clang)

              echo "Using system LLVM/Clang."

              ;;

            system-gcc)

              echo "Using system GNU GCC."

              ;;

            *)

              echo "❌ Unknown compiler: $COMPILER"
              exit 1

              ;;

          esac

          export PATH="$HOME/tc/bin:$PATH"

          echo ""
          echo "=========================================="
          echo "TOOLCHAIN VALIDATION"
          echo "=========================================="

          command -v clang || true
          command -v clang++ || true
          command -v ld.lld || true

          command -v gcc || true
          command -v g++ || true

          command -v aarch64-linux-gnu-gcc || true
          command -v arm-linux-gnueabi-gcc || true

          echo ""
          echo "Clang:"
          clang --version 2>/dev/null || true

          echo ""
          echo "LLD:"
          ld.lld --version 2>/dev/null || true

          echo ""
          echo "GCC:"
          gcc --version 2>/dev/null | head -n 1 || true

          echo ""
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version 2>/dev/null | head -n 1 || true


      # ========================================================
      # CONFIG PREPARATION
      # ========================================================

      - name: 🔀 Prepare Kernel Config
        run: |
          set -e

          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          CONFIG_INPUT="${{ inputs.kernel-config }}"
          IS_MERGE="${{ inputs.merge_config }}"

          BASE_DIR="arch/arm64/configs"

          echo "=========================================="
          echo "CONFIG PREPARATION"
          echo "=========================================="

          echo "Input : $CONFIG_INPUT"
          echo "Merge : $IS_MERGE"

          if [[ "$IS_MERGE" == "true" ]]; then

            IFS=',' read -ra CONF_FILES <<< "$CONFIG_INPUT"

            for i in "${!CONF_FILES[@]}"; do
              CONF_FILES[$i]=$(
                echo "${CONF_FILES[$i]}" |
                xargs
              )
            done

            BASE_CONF="${CONF_FILES[0]}"

            BASE_PATH="$BASE_DIR/vendor/xiaomi/$BASE_CONF"

            if [[ ! -f "$BASE_PATH" ]]; then

              echo "❌ Base config tidak ditemukan:"
              echo "$BASE_PATH"

              exit 1

            fi

            MERGED_CONFIG="$BASE_DIR/kyzuna_merged_defconfig"

            cp \
              "$BASE_PATH" \
              "$MERGED_CONFIG"

            echo "📦 Base Config: $BASE_CONF"

            for ((i=1; i<${#CONF_FILES[@]}; i++)); do

              FRAG="${CONF_FILES[$i]}"

              FRAG_PATH="$BASE_DIR/vendor/xiaomi/$FRAG"

              if [[ -f "$FRAG_PATH" ]]; then

                echo "🔗 Merge Fragment: $FRAG"

                printf '\n' >> "$MERGED_CONFIG"

                cat \
                  "$FRAG_PATH" \
                  >> "$MERGED_CONFIG"

              else

                echo "⚠️ Fragment tidak ditemukan: $FRAG"

              fi

            done

            MAKE_DEFCONFIG="kyzuna_merged_defconfig"

            TARGET_CONFIG="$MERGED_CONFIG"

          else

            CLEAN_CONF=$(
              echo "$CONFIG_INPUT" |
              xargs
            )

            if [[ "$CLEAN_CONF" == *.config ]]; then
              CLEAN_CONF="${CLEAN_CONF%.config}"
            fi

            if [[ -f "$BASE_DIR/$CLEAN_CONF" ]]; then

              MAKE_DEFCONFIG="$CLEAN_CONF"

              TARGET_CONFIG="$BASE_DIR/$CLEAN_CONF"

            elif [[ -f "$BASE_DIR/vendor/xiaomi/$CLEAN_CONF" ]]; then

              MAKE_DEFCONFIG="kyzuna_single_defconfig"

              TARGET_CONFIG="$BASE_DIR/$MAKE_DEFCONFIG"

              cp \
                "$BASE_DIR/vendor/xiaomi/$CLEAN_CONF" \
                "$TARGET_CONFIG"

            else

              echo "❌ Config tidak ditemukan:"
              echo "$CLEAN_CONF"

              echo ""
              echo "Available configs:"

              find \
                "$BASE_DIR" \
                -maxdepth 3 \
                -type f \
                | sort \
                | head -n 100

              exit 1

            fi

          fi

          echo "MAKE_DEFCONFIG=$MAKE_DEFCONFIG" >> "$GITHUB_ENV"

          echo "TARGET_CONFIG=$TARGET_CONFIG" >> "$GITHUB_ENV"

          echo ""
          echo "✅ MAKE_DEFCONFIG = $MAKE_DEFCONFIG"
          echo "✅ TARGET_CONFIG   = $TARGET_CONFIG"

          # ======================================================
          # VERSION
          # ======================================================

          sed -i \
            's/^EXTRAVERSION.*/EXTRAVERSION =/g' \
            Makefile

          CLEAN_KERNEL=$(
            echo "${{ inputs.kernel_name }}" |
            xargs
          )

          CLEAN_ROM=$(
            echo "${{ inputs.rom_type }}" |
            xargs
          )

          [[ -z "$CLEAN_KERNEL" ]] && CLEAN_KERNEL="none"

          [[ -z "$CLEAN_ROM" ]] && CLEAN_ROM="none"

          echo ""
          echo "=========================================="
          echo "VERSION CONFIGURATION"
          echo "=========================================="

          echo "Kernel Name : $CLEAN_KERNEL"
          echo "ROM Type    : $CLEAN_ROM"

          if [[ "$CLEAN_KERNEL" == "none" ]] &&
             [[ "$CLEAN_ROM" == "none" ]]; then

            echo "⏭️ Naming disabled."
            echo "⏭️ CONFIG_LOCALVERSION preserved."

            echo "LOCALVERSION_MODE=preserve" >> "$GITHUB_ENV"

          else

            echo "📝 Custom LOCALVERSION enabled."

            sed -i \
              '/^CONFIG_LOCALVERSION=/d' \
              "$TARGET_CONFIG"

            sed -i \
              '/^# CONFIG_LOCALVERSION is not set$/d' \
              "$TARGET_CONFIG"

            echo 'CONFIG_LOCALVERSION=""' \
              >> "$TARGET_CONFIG"

            echo "LOCALVERSION_MODE=custom" >> "$GITHUB_ENV"

          fi


      # ========================================================
      # PRE-KSU TWEAK
      # ========================================================

      - name: 🧩 Apply Pre-KSU Tweaks
        run: |
          set -e

          cd kernel-dir

          INPUT_STRING="${{ inputs.custom_tweaks }}"

          if [[ "$INPUT_STRING" == "none" ||
                -z "$INPUT_STRING" ]]; then

            echo "⏭️ No Pre-KSU tweak."

            exit 0

          fi

          REPO_TREE_CACHE=$(
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "$REPO_API" |
            grep -o '"path": "[^"]*"' |
            cut -d'"' -f4
          )

          IFS=',' read -ra FILES <<< "$INPUT_STRING"

          for file in "${FILES[@]}"; do

            file=$(echo "$file" | xargs)

            [[ -z "$file" ]] && continue

            FILE_PATH=$(
              echo "$REPO_TREE_CACHE" |
              grep -E "(^|/)$file$" |
              head -n 1
            )

            if [[ -z "$FILE_PATH" ]]; then

              echo "❌ Tweak tidak ditemukan: $file"

              exit 1

            fi

            echo "✅ Applying: $file"

            wget -q \
              "$REPO_RAW/$FILE_PATH" \
              -O "$file"

            if [[ "$file" == *.patch ]]; then

              patch -p1 < "$file"

            elif [[ "$file" == *.sh ]]; then

              chmod +x "$file"

              bash "$file"

            fi

          done


      # ========================================================
      # KSU
      # ========================================================

      - name: 👑 Configure & Install KSU
        run: |
          set -e

          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"

          KSU_CHOICE="${{ inputs.kernelsu }}"

          SUSFS_ENABLE="${{ inputs.susfs_enable }}"

          set_cfg() {

            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then

              echo "CONFIG_${cfg}=y" \
                >> "$TARGET_CONFIG"

            else

              echo "# CONFIG_${cfg} is not set" \
                >> "$TARGET_CONFIG"

            fi

          }

          enable_cfg() {

            for cfg in "$@"; do
              set_cfg "$cfg" y
            done

          }

          disable_cfg() {

            for cfg in "$@"; do
              set_cfg "$cfg" n
            done

          }

          echo "=========================================="
          echo "KSU: $KSU_CHOICE"
          echo "=========================================="

          if [[ "$KSU_CHOICE" == "none" ]]; then

            echo "🧹 Root method disabled."

          elif [[ "$KSU_CHOICE" == "apatch" ]]; then

            echo "🧬 APatch configuration."

            enable_cfg \
              KALLSYMS \
              KALLSYMS_ALL \
              KALLSYMS_BASE_RELATIVE \
              KPROBES \
              HAVE_KPROBES

          else

            echo "🔑 Installing KernelSU."

            enable_cfg KSU

            case "$KSU_CHOICE" in

              sorayukii)

                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s hookless

                enable_cfg \
                  KSU_EXTRAS \
                  KSU_TAMPER_SYSCALL_TABLE

                disable_cfg KPROBES

                ;;

              mr-morat)

                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s syscall

                enable_cfg \
                  KSU_EXTRAS \
                  KSU_TAMPER_SYSCALL_TABLE

                disable_cfg KPROBES

                ;;

              enjoy)

                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s enjoy

                enable_cfg KSU_MANUAL_HOOK

                disable_cfg \
                  KPROBES \
                  HAVE_KPROBES

                ;;

              legacy)

                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s legacy

                enable_cfg KSU_MANUAL_HOOK

                disable_cfg \
                  KPROBES \
                  HAVE_KPROBES

                ;;

              sukisu)

                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s resukisu

                if [[ "$SUSFS_ENABLE" != "true" ]]; then
                  enable_cfg KSU_MANUAL_HOOK
                fi

                ;;

              next)

                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s legacy-susfs-v2

                enable_cfg KSU_MANUAL_HOOK

                ;;

              resukisu)

                curl -LSs \
                  'https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh' |
                  bash -s main

                if [[ "$SUSFS_ENABLE" != "true" ]]; then
                  enable_cfg KSU_MANUAL_HOOK
                fi

                ;;

              thre)

                curl -LSs \
                  'https://raw.githubusercontent.com/ThRE-Team/KernelSU-Next/main/kernel/setup.sh' |
                  bash -s main

                disable_cfg \
                  KPROBES \
                  HAVE_KPROBES

                enable_cfg KSU_MANUAL_HOOK

                ;;

              *)

                echo "❌ Unknown KSU method."

                exit 1

                ;;

            esac

          fi


      # ========================================================
      # SUSFS CUSTOM
      # ========================================================

      - name: 🪝 Apply SuSFS Custom
        run: |
          set -e

          cd kernel-dir

          INPUT_STRING="${{ inputs.susfs_custom }}"

          if [[ "$INPUT_STRING" == "none" ||
                -z "$INPUT_STRING" ]]; then

            echo "⏭️ No SuSFS custom patch."

            exit 0

          fi

          REPO_TREE_CACHE=$(
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "$REPO_API" |
            grep -o '"path": "[^"]*"' |
            cut -d'"' -f4
          )

          IFS=',' read -ra FILES <<< "$INPUT_STRING"

          for file in "${FILES[@]}"; do

            file=$(echo "$file" | xargs)

            [[ -z "$file" ]] && continue

            FILE_PATH=$(
              echo "$REPO_TREE_CACHE" |
              grep -E "(^|/)$file$" |
              head -n 1
            )

            if [[ -z "$FILE_PATH" ]]; then

              echo "❌ SuSFS file tidak ditemukan: $file"

              exit 1

            fi

            echo "✅ Applying SuSFS: $file"

            wget -q \
              "$REPO_RAW/$FILE_PATH" \
              -O "$file"

            if [[ "$file" == *.patch ]]; then

              patch -p1 < "$file" || {
                echo "⚠️ Patch reject."
                echo "⚠️ Build tetap dilanjutkan."
              }

            elif [[ "$file" == *.sh ]]; then

              chmod +x "$file"

              bash "$file"

            fi

          done


      # ========================================================
      # SUSFS CONFIG
      # ========================================================

      - name: 🛡️ Configure SuSFS
        run: |
          set -e

          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"

          SUSFS_ENABLE="${{ inputs.susfs_enable }}"

          set_cfg() {

            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then

              echo "CONFIG_${cfg}=y" \
                >> "$TARGET_CONFIG"

            else

              echo "# CONFIG_${cfg} is not set" \
                >> "$TARGET_CONFIG"

            fi

          }

          enable_cfg() {

            for cfg in "$@"; do
              set_cfg "$cfg" y
            done

          }

          disable_cfg() {

            for cfg in "$@"; do
              set_cfg "$cfg" n
            done

          }

          if [[ "$SUSFS_ENABLE" == "true" ]]; then

            echo "🛡️ Enabling SuSFS."

            enable_cfg \
              KSU_SUSFS \
              KSU_SUSFS_SUS_PATH \
              KSU_SUSFS_SUS_MOUNT \
              KSU_SUSFS_SUS_KSTAT \
              KSU_SUSFS_SPOOF_UNAME \
              KSU_SUSFS_ENABLE_LOG \
              KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              KSU_SUSFS_OPEN_REDIRECT \
              KSU_SUSFS_SUS_MAP

            if grep -q \
              "THREAD_INFO_IN_TASK" \
              drivers/kernelsu/Kconfig \
              2>/dev/null; then

              enable_cfg THREAD_INFO_IN_TASK

            fi

          else

            echo "🛑 SuSFS disabled."

            disable_cfg KSU_SUSFS

          fi


      # ========================================================
      # CUSTOM HOOK
      # ========================================================

      - name: 💉 Apply Custom Hooks
        run: |
          set -e

          cd kernel-dir

          INPUT_STRING="${{ inputs.custom_hooks }}"

          if [[ "$INPUT_STRING" == "none" ||
                -z "$INPUT_STRING" ]]; then

            echo "⏭️ No custom hook."

            exit 0

          fi

          REPO_TREE_CACHE=$(
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "$REPO_API" |
            grep -o '"path": "[^"]*"' |
            cut -d'"' -f4
          )

          IFS=',' read -ra FILES <<< "$INPUT_STRING"

          for file in "${FILES[@]}"; do

            file=$(echo "$file" | xargs)

            [[ -z "$file" ]] && continue

            FILE_PATH=$(
              echo "$REPO_TREE_CACHE" |
              grep -E "(^|/)$file$" |
              head -n 1
            )

            if [[ -z "$FILE_PATH" ]]; then

              echo "❌ Hook tidak ditemukan: $file"

              exit 1

            fi

            echo "✅ Applying Hook: $file"

            wget -q \
              "$REPO_RAW/$FILE_PATH" \
              -O "$file"

            if [[ "$file" == *.patch ]]; then

              patch -p1 < "$file"

            elif [[ "$file" == *.sh ]]; then

              chmod +x "$file"

              bash "$file"

            fi

          done


      # ========================================================
      # LTO
      # ========================================================

      - name: 🚀 Configure LTO
        run: |
          set -e

          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"

          LTO_MODE="${{ inputs.lto_mode }}"

          set_cfg() {

            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then

              echo "CONFIG_${cfg}=y" \
                >> "$TARGET_CONFIG"

            else

              echo "# CONFIG_${cfg} is not set" \
                >> "$TARGET_CONFIG"

            fi

          }

          enable_cfg() {

            for cfg in "$@"; do
              set_cfg "$cfg" y
            done

          }

          disable_cfg() {

            for cfg in "$@"; do
              set_cfg "$cfg" n
            done

          }

          echo "🧬 LTO Mode: $LTO_MODE"

          disable_cfg \
            LTO \
            LTO_CLANG \
            LTO_CLANG_FULL \
            LTO_CLANG_THIN \
            THINLTO \
            LTO_NONE

          case "$LTO_MODE" in

            full)

              enable_cfg \
                LTO \
                LTO_CLANG \
                LTO_CLANG_FULL

              ;;

            thin)

              enable_cfg \
                LTO \
                LTO_CLANG \
                LTO_CLANG_THIN \
                THINLTO

              ;;

            "no lto")

              enable_cfg LTO_NONE

              ;;

            *)

              echo "❌ Invalid LTO mode."

              exit 1

              ;;

          esac


      # ========================================================
      # EXTRA CONFIG
      # ========================================================

      - name: 🛠️ Apply Extra Config
        run: |
          set -e

          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"

          EXTRA_CONFIG="${{ inputs.extra_config }}"

          if [[ "$EXTRA_CONFIG" == "none" ||
                -z "$EXTRA_CONFIG" ]]; then

            echo "⏭️ No extra config."

            exit 0

          fi

          set_cfg() {

            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then

              echo "CONFIG_${cfg}=y" \
                >> "$TARGET_CONFIG"

            else

              echo "# CONFIG_${cfg} is not set" \
                >> "$TARGET_CONFIG"

            fi

          }

          IFS=',' read -ra CONFIGS <<< "$EXTRA_CONFIG"

          for CFG in "${CONFIGS[@]}"; do

            CFG=$(echo "$CFG" | xargs)

            [[ -z "$CFG" ]] && continue

            CFG=$(echo "$CFG" | tr '[:lower:]' '[:upper:]')

            if [[ "$CFG" == CONFIG_* ]]; then
              CFG="${CFG#CONFIG_}"
            fi

            if [[ "$CFG" == -* ]]; then

              CFG="${CFG#-}"

              echo "❌ Disable: CONFIG_$CFG"

              set_cfg "$CFG" n

            elif [[ "$CFG" == *=N ]]; then

              CFG="${CFG%=N}"

              echo "❌ Disable: CONFIG_$CFG"

              set_cfg "$CFG" n

            elif [[ "$CFG" == *=Y ]]; then

              CFG="${CFG%=Y}"

              echo "✅ Enable: CONFIG_$CFG"

              set_cfg "$CFG" y

            else

              echo "✅ Enable: CONFIG_$CFG"

              set_cfg "$CFG" y

            fi

          done


      # ========================================================
      # DEFCONFIG
      # ========================================================

      - name: ⚙️ Generate Defconfig
        run: |
          set -e

          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          BASENAME_CONFIG="${{ env.MAKE_DEFCONFIG }}"

          if [[ ! -f \
            "arch/arm64/configs/$BASENAME_CONFIG" ]]; then

            echo "❌ Defconfig tidak ditemukan:"
            echo "arch/arm64/configs/$BASENAME_CONFIG"

            exit 1

          fi

          rm -rf ../out

          mkdir -p ../out

          echo "=========================================="
          echo "GENERATING DEFCONFIG"
          echo "=========================================="

          make \
            -s \
            ARCH=arm64 \
            O=../out \
            "$BASENAME_CONFIG"

          if [[ ! -f ../out/.config ]]; then

            echo "❌ .config tidak berhasil dibuat."

            exit 1

          fi

          echo ""
          echo "Compiler selected by config:"

          grep -E \
            '^CONFIG_CC_IS_|^CONFIG_LD_IS_' \
            ../out/.config \
            2>/dev/null || true


      # ========================================================
      # COMPILER RESOLVER
      # ========================================================

      - name: 🧠 Auto Detect Compiler & Build Environment
        run: |
          set -e

          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          REQUESTED_MODE="${{ inputs.compiler_mode }}"

          REQUESTED_COMPILER="${{ inputs.compiler }}"

          IAS_MODE="${{ inputs.llvm_ias }}"

          echo "=========================================="
          echo "SMART COMPILER RESOLVER"
          echo "=========================================="

          echo "Requested Mode      : $REQUESTED_MODE"
          echo "Requested Compiler  : $REQUESTED_COMPILER"
          echo "Requested LLVM IAS  : $IAS_MODE"

          COMPILER_MODE="$REQUESTED_MODE"

          # ----------------------------------------------------
          # AUTO COMPILER DETECTION
          # ----------------------------------------------------

          if [[ "$COMPILER_MODE" == "auto" ]]; then

            if grep -q \
              '^CONFIG_CC_IS_CLANG=y' \
              ../out/.config \
              2>/dev/null; then

              COMPILER_MODE="clang"

              echo "🧠 Config requests Clang."

            elif grep -q \
              '^CONFIG_CC_IS_GCC=y' \
              ../out/.config \
              2>/dev/null; then

              COMPILER_MODE="gcc"

              echo "🧠 Config requests GCC."

            elif grep -q \
              'CONFIG_LTO_CLANG=y' \
              ../out/.config \
              2>/dev/null; then

              COMPILER_MODE="clang"

              echo "🧠 LTO-Clang detected."

            else

              # Old kernels generally have better GCC compatibility.
              # Explicit compiler choice can still override this.

              if [[ "$REQUESTED_COMPILER" == *clang* ]]; then

                COMPILER_MODE="clang"

                echo "🧠 Clang toolchain selected."

              else

                COMPILER_MODE="gcc"

                echo "🧠 GCC fallback selected."

              fi

            fi

          fi

          # ----------------------------------------------------
          # VALIDATE GCC
          # ----------------------------------------------------

          if [[ "$COMPILER_MODE" == "gcc" ]]; then

            echo ""
            echo "=========================================="
            echo "GNU GCC MODE"
            echo "=========================================="

            command -v gcc

            command -v aarch64-linux-gnu-gcc

            command -v arm-linux-gnueabi-gcc

            GCC_VERSION=$(
              aarch64-linux-gnu-gcc \
                --version |
              head -n 1
            )

            echo "AArch64 GCC: $GCC_VERSION"

            BUILD_CC="aarch64-linux-gnu-gcc"

            BUILD_HOSTCC="gcc"

            BUILD_HOSTCXX="g++"

            BUILD_LD="aarch64-linux-gnu-ld"

            BUILD_HOSTLD="ld"

            BUILD_AR="aarch64-linux-gnu-ar"

            BUILD_HOSTAR="ar"

            BUILD_NM="aarch64-linux-gnu-nm"

            BUILD_OBJCOPY="aarch64-linux-gnu-objcopy"

            BUILD_OBJDUMP="aarch64-linux-gnu-objdump"

            BUILD_STRIP="aarch64-linux-gnu-strip"

            BUILD_READELF="aarch64-linux-gnu-readelf"

            BUILD_LLVM="0"

            BUILD_IAS="0"

          # ----------------------------------------------------
          # CLANG
          # ----------------------------------------------------

          elif [[ "$COMPILER_MODE" == "clang" ]]; then

            echo ""
            echo "=========================================="
            echo "LLVM / CLANG MODE"
            echo "=========================================="

            if ! command -v clang >/dev/null 2>&1; then

              echo "❌ clang not found."

              exit 1

            fi

            if ! command -v ld.lld >/dev/null 2>&1; then

              echo "❌ ld.lld not found."

              exit 1

            fi

            BUILD_CC="clang"

            BUILD_HOSTCC="clang"

            BUILD_HOSTCXX="clang++"

            BUILD_LD="ld.lld"

            BUILD_HOSTLD="ld.lld"

            BUILD_AR="llvm-ar"

            BUILD_HOSTAR="llvm-ar"

            BUILD_NM="llvm-nm"

            BUILD_OBJCOPY="llvm-objcopy"

            BUILD_OBJDUMP="llvm-objdump"

            BUILD_STRIP="llvm-strip"

            BUILD_READELF="llvm-readelf"

            BUILD_LLVM="1"

            if [[ "$IAS_MODE" == "enabled" ]]; then

              BUILD_IAS="1"

            elif [[ "$IAS_MODE" == "disabled" ]]; then

              BUILD_IAS="0"

            else

              # Auto:
              # Old kernels sometimes fail with LLVM IAS.
              # Modern LLVM-compatible kernels generally work.

              if grep -q \
                'CONFIG_CC_IS_CLANG=y' \
                ../out/.config \
                2>/dev/null; then

                BUILD_IAS="1"

              else

                BUILD_IAS="1"

              fi

            fi

          else

            echo "❌ Unknown compiler mode:"
            echo "$COMPILER_MODE"

            exit 1

          fi

          # ----------------------------------------------------
          # SAVE BUILD ENVIRONMENT
          # ----------------------------------------------------

          {

            echo "COMPILER_MODE=$COMPILER_MODE"

            echo "BUILD_CC=$BUILD_CC"

            echo "BUILD_HOSTCC=$BUILD_HOSTCC"

            echo "BUILD_HOSTCXX=$BUILD_HOSTCXX"

            echo "BUILD_LD=$BUILD_LD"

            echo "BUILD_HOSTLD=$BUILD_HOSTLD"

            echo "BUILD_AR=$BUILD_AR"

            echo "BUILD_HOSTAR=$BUILD_HOSTAR"

            echo "BUILD_NM=$BUILD_NM"

            echo "BUILD_OBJCOPY=$BUILD_OBJCOPY"

            echo "BUILD_OBJDUMP=$BUILD_OBJDUMP"

            echo "BUILD_STRIP=$BUILD_STRIP"

            echo "BUILD_READELF=$BUILD_READELF"

            echo "BUILD_LLVM=$BUILD_LLVM"

            echo "BUILD_IAS=$BUILD_IAS"

          } >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "FINAL COMPILER"
          echo "=========================================="

          echo "Mode     : $COMPILER_MODE"
          echo "CC       : $BUILD_CC"
          echo "HOSTCC   : $BUILD_HOSTCC"
          echo "LD       : $BUILD_LD"
          echo "LLVM     : $BUILD_LLVM"
          echo "LLVM IAS : $BUILD_IAS"

          echo ""
          echo "Compiler version:"

          "$BUILD_CC" --version 2>/dev/null |
            head -n 2 || true

          echo ""
          echo "Linker version:"

          "$BUILD_LD" --version 2>/dev/null |
            head -n 2 || true


      # ========================================================
      # COMPILER STRING
      # ========================================================

      - name: 🧬 Generate Compiler String
        run: |
          set -e

          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          CUSTOM_ENABLE="${{ inputs.custom_compiler_name_enable }}"

          CUSTOM_NAME="${{ inputs.custom_compiler_name }}"

          if [[ "$CUSTOM_ENABLE" == "true" ]] &&
             [[ -n "$CUSTOM_NAME" ]] &&
             [[ "$CUSTOM_NAME" != "none" ]]; then

            COMPILER_NAME="$CUSTOM_NAME"

          else

            if [[ "${{ env.COMPILER_MODE }}" == "gcc" ]]; then

              COMPILER_NAME="GNU GCC"

            else

              COMPILER_NAME="${{ inputs.compiler }}"

              COMPILER_NAME=$(
                echo "$COMPILER_NAME" |
                awk -F'-' \
                '{print toupper(substr($1,1,1)) substr($1,2) " Clang"}'
              )

            fi

          fi

          if [[ "${{ env.COMPILER_MODE }}" == "gcc" ]]; then

            RAW_COMPILER_VER=$(
              aarch64-linux-gnu-gcc \
                --version |
              grep -oE \
                '[0-9]+\.[0-9]+\.[0-9]+' |
              head -n 1
            )

            RAW_LLD_VER="GNU ld"

          else

            RAW_COMPILER_VER=$(
              clang \
                --version \
                2>/dev/null |
              grep -oE \
                '[0-9]+\.[0-9]+\.[0-9]+' |
              head -n 1
            )

            RAW_LLD_VER=$(
              ld.lld \
                --version \
                2>/dev/null |
              grep -oE \
                '[0-9]+\.[0-9]+\.[0-9]+' |
              head -n 1
            )

          fi

          RAW_COMPILER_VER="${RAW_COMPILER_VER:-Custom}"

          RAW_LLD_VER="${RAW_LLD_VER:-Custom}"

          CUSTOM_COMPILER_STRING="${COMPILER_NAME} ${RAW_COMPILER_VER} ✦ Pipeline: pgo • autofdo • bolt • propeller • thinlto • mlgo • polly • -o3 ✦ LLD ${RAW_LLD_VER}"

          echo \
            "CUSTOM_COMPILER_STRING=$CUSTOM_COMPILER_STRING" \
            >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "KBUILD COMPILER STRING"
          echo "=========================================="

          echo "$CUSTOM_COMPILER_STRING"


      # ========================================================
      # FINAL CONFIG VALIDATION
      # ========================================================

      - name: 🔍 Validate Kernel Configuration
        run: |
          set -e

          cd kernel-dir

          echo "=========================================="
          echo "CONFIG VALIDATION"
          echo "=========================================="

          if [[ ! -f ../out/.config ]]; then

            echo "❌ Generated .config missing."

            exit 1

          fi

          echo "Architecture:"
          grep \
            '^CONFIG_ARCH=' \
            ../out/.config \
            2>/dev/null || true

          echo ""
          echo "Compiler:"
          grep \
            '^CONFIG_CC_IS_' \
            ../out/.config \
            2>/dev/null || true

          echo ""
          echo "LTO:"
          grep \
            -E \
            '^CONFIG_LTO|^CONFIG_THINLTO' \
            ../out/.config \
            2>/dev/null || true

          echo ""
          echo "KSU:"
          grep \
            -E \
            '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=' \
            ../out/.config \
            2>/dev/null || true


      # ========================================================
      # COMPILE
      # ========================================================

      - name: 🔨 Compile Kernel
        run: |
          set -o pipefail

          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          export KBUILD_BUILD_USER="${{ inputs.project_name }}"

          export KBUILD_BUILD_HOST="project"

          export KBUILD_COMPILER_STRING="$CUSTOM_COMPILER_STRING"

          export LLVM_PARALLEL=1

          # ----------------------------------------------------
          # VERSION HASH
          # ----------------------------------------------------

          if [[ "${{ inputs.version_hash }}" == "no hash" ]]; then

            echo "" > .scmversion

            export LOCALVERSION_AUTO=""

          else

            rm -f .scmversion

          fi

          # ----------------------------------------------------
          # CORES / JOBS
          # ----------------------------------------------------

          CORES=$(nproc --all)

          MAKE_JOBS=$(( (CORES + 1) / 2 ))

          if [[ "${{ inputs.lto_mode }}" == "full" ]]; then
            MAKE_JOBS=2
          fi

          if [[ "$MAKE_JOBS" -lt 2 ]]; then
            MAKE_JOBS=2
          fi

          if [[ "$MAKE_JOBS" -gt 8 ]]; then
            MAKE_JOBS=8
          fi

          # ----------------------------------------------------
          # LOCALVERSION
          # ----------------------------------------------------

          CLEAN_KERNEL=$(
            echo "${{ inputs.kernel_name }}" |
            xargs
          )

          CLEAN_ROM=$(
            echo "${{ inputs.rom_type }}" |
            xargs
          )

          [[ -z "$CLEAN_KERNEL" ]] && CLEAN_KERNEL="none"

          [[ -z "$CLEAN_ROM" ]] && CLEAN_ROM="none"

          LOCALVERSION=""

          if [[ "$CLEAN_KERNEL" != "none" ]]; then
            LOCALVERSION="$LOCALVERSION-$CLEAN_KERNEL"
          fi

          if [[ "$CLEAN_ROM" != "none" ]]; then
            LOCALVERSION="$LOCALVERSION-$CLEAN_ROM"
          fi

          # ----------------------------------------------------
          # GCC / CLANG FLAGS
          # ----------------------------------------------------

          EXTRA_CFLAGS=""

          if [[ "${{ env.COMPILER_MODE }}" == "gcc" ]]; then

            EXTRA_CFLAGS=""

          else

            EXTRA_CFLAGS="-Qunused-arguments"

          fi

          # ----------------------------------------------------
          # LLVM ARGUMENTS
          # ----------------------------------------------------

          BUILD_ARGS=()

          if [[ "${{ env.COMPILER_MODE }}" == "clang" ]]; then

            BUILD_ARGS+=(
              "LLVM=1"
              "LLVM_IAS=${{ env.BUILD_IAS }}"
              "CC=${{ env.BUILD_CC }}"
              "HOSTCC=${{ env.BUILD_HOSTCC }}"
              "HOSTCXX=${{ env.BUILD_HOSTCXX }}"
              "LD=${{ env.BUILD_LD }}"
              "HOSTLD=${{ env.BUILD_HOSTLD }}"
              "AR=${{ env.BUILD_AR }}"
              "HOSTAR=${{ env.BUILD_HOSTAR }}"
              "NM=${{ env.BUILD_NM }}"
              "OBJCOPY=${{ env.BUILD_OBJCOPY }}"
              "OBJDUMP=${{ env.BUILD_OBJDUMP }}"
              "STRIP=${{ env.BUILD_STRIP }}"
              "READELF=${{ env.BUILD_READELF }}"
            )

          else

            BUILD_ARGS+=(
              "CC=${{ env.BUILD_CC }}"
              "HOSTCC=${{ env.BUILD_HOSTCC }}"
              "HOSTCXX=${{ env.BUILD_HOSTCXX }}"
              "LD=${{ env.BUILD_LD }}"
              "HOSTLD=${{ env.BUILD_HOSTLD }}"
              "AR=${{ env.BUILD_AR }}"
              "HOSTAR=${{ env.BUILD_HOSTAR }}"
              "NM=${{ env.BUILD_NM }}"
              "OBJCOPY=${{ env.BUILD_OBJCOPY }}"
              "OBJDUMP=${{ env.BUILD_OBJDUMP }}"
              "STRIP=${{ env.BUILD_STRIP }}"
              "READELF=${{ env.BUILD_READELF }}"
            )

          fi

          # ----------------------------------------------------
          # BUILD INFO
          # ----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "FINAL BUILD INFORMATION"
          echo "=========================================="

          echo "CPU Cores : $CORES"
          echo "Jobs      : $MAKE_JOBS"
          echo "Compiler  : ${{ env.COMPILER_MODE }}"
          echo "CC        : ${{ env.BUILD_CC }}"
          echo "LD        : ${{ env.BUILD_LD }}"
          echo "LLVM      : ${{ env.BUILD_LLVM }}"
          echo "LLVM IAS  : ${{ env.BUILD_IAS }}"
          echo "LTO       : ${{ inputs.lto_mode }}"
          echo "Kernel    : $CLEAN_KERNEL"
          echo "ROM       : $CLEAN_ROM"
          echo "Version   : ${LOCALVERSION:-<preserved>}"

          echo "=========================================="

          # ----------------------------------------------------
          # BUILD
          # ----------------------------------------------------

          make \
            -j"$MAKE_JOBS" \
            ARCH=arm64 \
            O=../out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="$LOCALVERSION" \
            KCFLAGS="-O3 -w $EXTRA_CFLAGS" \
            HOSTCFLAGS="-w" \
            "${BUILD_ARGS[@]}" \
            Image.gz \
            Image.gz-dtb \
            dtbs \
            2>&1 |
            tee ../build.log |
            grep -vE \
              'clang: warning:|ld.lld: warning:|Broken pipe|no symbols' \
            || {

              echo ""
              echo "=========================================="
              echo "❌ KERNEL BUILD FAILED"
              echo "=========================================="

              tail -n 100 ../build.log

              exit 1
            }

          # ----------------------------------------------------
          # VERIFY IMAGE
          # ----------------------------------------------------

          KERNEL_DIR="../out/arch/arm64/boot"

          echo ""
          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          find \
            "$KERNEL_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' |
            sort

          if [[ -s "$KERNEL_DIR/Image.gz" ]]; then

            echo "✅ Image.gz generated."

          elif [[ -s "$KERNEL_DIR/Image.gz-dtb" ]]; then

            echo "✅ Image.gz-dtb generated."

          elif [[ -s "$KERNEL_DIR/Image-dtb" ]]; then

            echo "✅ Image-dtb generated."

          elif [[ -s "$KERNEL_DIR/Image" ]]; then

            echo "✅ Image generated."

          else

            echo "❌ No kernel image found."

            exit 1

          fi


      # ========================================================
      # PACKAGE
      # ========================================================

      - name: 📦 Package with AnyKernel3
        run: |
          set -e

          echo "=========================================="
          echo "ANYKERNEL3"
          echo "=========================================="

          git clone \
            --depth=1 \
            "${{ inputs.anykernel-url }}" \
            AnyKernel3

          cd AnyKernel3

          rm -rf \
            .git \
            .github \
            LICENSE \
            README.md \
            modules \
            patch \
            ramdisk

          rm -f \
            *.txt \
            *.md \
            *placeholder

          cd ..

          KERNEL_DIR="out/arch/arm64/boot"

          echo "Preparing kernel image."

          # ----------------------------------------------------
          # AUTO IMAGE DETECTION
          # ----------------------------------------------------

          if [[ \
            -f "$KERNEL_DIR/Image.gz" &&
            -f "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb"
          ]]; then

            echo "📦 Creating Image.gz-dtb."

            cat \
              "$KERNEL_DIR/Image.gz" \
              "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" \
              > AnyKernel3/Image.gz-dtb

          elif [[ -f "$KERNEL_DIR/Image.gz-dtb" ]]; then

            echo "✅ Using Image.gz-dtb."

            cp \
              "$KERNEL_DIR/Image.gz-dtb" \
              AnyKernel3/

          elif [[ -f "$KERNEL_DIR/Image-dtb" ]]; then

            echo "✅ Using Image-dtb."

            cp \
              "$KERNEL_DIR/Image-dtb" \
              AnyKernel3/

          elif [[ -f "$KERNEL_DIR/Image.gz" ]]; then

            echo "✅ Using Image.gz."

            cp \
              "$KERNEL_DIR/Image.gz" \
              AnyKernel3/

          elif [[ -f "$KERNEL_DIR/Image" ]]; then

            echo "⚠️ Image.gz not found."

            echo "🗜️ Compressing Image."

            gzip -n -9 \
              < "$KERNEL_DIR/Image" \
              > AnyKernel3/Image.gz

          else

            echo "❌ Kernel Image tidak ditemukan."

            exit 1

          fi

          # ----------------------------------------------------
          # DTBO
          # ----------------------------------------------------

          if [[ -f "$KERNEL_DIR/dtbo.img" ]]; then

            echo "💾 Copying dtbo.img."

            cp \
              "$KERNEL_DIR/dtbo.img" \
              AnyKernel3/

          fi

          # ----------------------------------------------------
          # DTB FALLBACK
          # ----------------------------------------------------

          if [[ ! -f AnyKernel3/Image.gz-dtb ]] &&
             [[ -f "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" ]]; then

            if [[ -f AnyKernel3/Image.gz ]]; then

              echo "📦 Appending beryllium DTB."

              cat \
                AnyKernel3/Image.gz \
                "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" \
                > AnyKernel3/Image.gz-dtb

              rm -f AnyKernel3/Image.gz

            fi

          fi

          # ----------------------------------------------------
          # VERIFY
          # ----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "PACKAGE VERIFICATION"
          echo "=========================================="

          ls -lah AnyKernel3/

          if ! ls AnyKernel3/Image* >/dev/null 2>&1; then

            echo "❌ Kernel image missing from package."

            exit 1

          fi

          echo "✨ Kernel successfully packaged."


      # ========================================================
      # FINAL NAME
      # ========================================================

      - name: 🏷️ Generate Artifact Name
        run: |
          CLEAN_ZIP_NAME=$(
            echo "${{ inputs.zip_name }}" |
            xargs |
            tr ' ' '_'
          )

          [[ -z "$CLEAN_ZIP_NAME" ]] &&
            CLEAN_ZIP_NAME="Kyzuna-Kernel"

          echo \
            "FINAL_ARTIFACT_NAME=$CLEAN_ZIP_NAME" \
            >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "FINAL ARTIFACT"
          echo "=========================================="

          echo "$CLEAN_ZIP_NAME"


      # ========================================================
      # BUILD LOG
      # ========================================================

      - name: 📋 Prepare Build Information
        run: |
          cat > build-info.txt <<EOF
          ==========================================
          KYZUNA UNIVERSAL KERNEL BUILDER
          ==========================================

          Project       : ${{ inputs.project_name }}

          Kernel URL    : ${{ inputs.kernel-url }}

          Kernel Branch : ${{ inputs.kernel-branch }}

          Kernel Config : ${{ inputs.kernel-config }}

          Kernel Name   : ${{ inputs.kernel_name }}

          ROM Type      : ${{ inputs.rom_type }}

          Compiler Mode : ${{ env.COMPILER_MODE }}

          Compiler      : ${{ inputs.compiler }}

          Compiler Name : $CUSTOM_COMPILER_STRING

          CC            : ${{ env.BUILD_CC }}

          LD            : ${{ env.BUILD_LD }}

          LLVM          : ${{ env.BUILD_LLVM }}

          LLVM IAS      : ${{ env.BUILD_IAS }}

          LTO           : ${{ inputs.lto_mode }}

          KSU           : ${{ inputs.kernelsu }}

          SuSFS         : ${{ inputs.susfs_enable }}

          Version Hash  : ${{ inputs.version_hash }}

          ==========================================
          EOF

          cat build-info.txt


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: 📤 Upload Kernel Artifact
        uses: actions/upload-artifact@v4

        with:
          name: '${{ env.FINAL_ARTIFACT_NAME }}'

          path: |
            AnyKernel3/
            build-info.txt
            build.log

          compression-level: 9

          if-no-files-found: error
          
