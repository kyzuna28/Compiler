# Kyzuna Project - Customized for Poco F1 (beryllium)
name: Build Final

run-name: 🚀 ${{ inputs.zip_name }} | ${{ inputs.kernel-config }} | ${{ inputs.kernel_name }} | ${{ inputs.rom_type }} | ${{ inputs.compiler }} | ${{ inputs.lto_mode }} | ${{ inputs.kernel-branch }} | ${{ inputs.kernelsu }}

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip Output Name'
        required: true
        type: string

      ubuntu:
        description: 'Ubuntu Version'
        default: 'ubuntu-24.04'
        required: true
        type: string

      kernel_name:
        description: 'Kernel Name (none = tidak mengubah nama kernel)'
        default: 'none'
        required: true
        type: string

      rom_type:
        description: 'ROM Type (cth: AOSP / MIUI / none)'
        default: 'none'
        required: true
        type: string

      project_name:
        description: 'Project Name'
        default: 'selea×kyy'
        required: true
        type: string

      compiler:
        description: 'Compiler Choice'
        default: 'aosp-clang'
        required: true
        type: choice
        options:
          - zyc-clang
          - yuki-clang
          - weebx-clang
          - neutron-clang
          - aosp-clang
          - debian-clang

      custom_compiler_name_enable:
        description: 'Enable Custom Compiler Name'
        default: false
        required: true
        type: boolean

      custom_compiler_name:
        description: 'Custom Compiler Name (dipakai jika enabled)'
        default: 'Custom Clang'
        required: false
        type: string

      lto_mode:
        description: 'LTO Optimization'
        default: 'no lto'
        required: true
        type: choice
        options:
          - 'no lto'
          - full
          - thin

      merge_config:
        description: 'Merge Config (vendor/xiaomi) / Single Config (arch/configs)'
        default: false
        type: boolean

      kernel-config:
        description: 'Nama config (cth: defconfig atau mi_defconfig)'
        default: 'defconfig'
        required: true
        type: string

      custom_tweaks:
        description: '1. Tweak .sh/.patch (Pre-KSU). Kosong = none'
        default: 'none'
        required: false
        type: string

      kernelsu:
        description: '2 & 3. Pilih Root Method / Fork KSU'
        default: 'none'
        required: true
        type: choice
        options:
          - 'none'
          - 'apatch'
          - 'sorayukii'
          - 'mr-morat'
          - 'enjoy'
          - 'legacy'
          - 'sukisu'
          - 'next'
          - 'resukisu'
          - 'thre'

      susfs_custom:
        description: '4. SuSFS Script .sh/.patch (Post-SuSFS). Kosong = none'
        default: 'none'
        required: false
        type: string

      susfs_enable:
        description: '5 & 6. Enable SuSFS & Config'
        default: false
        type: boolean

      custom_hooks:
        description: '7. Hook Script/Patch khusus (.sh/.patch). Kosong = none'
        default: 'none'
        required: false
        type: string

      extra_config:
        description: '8. Ekstra Config manual (cth: debug_fs, -preempt). Kosong = none'
        required: false
        type: string
        default: 'none'

      version_hash:
        description: 'Include Version Hash'
        default: 'no hash'
        required: true
        type: choice
        options:
          - 'no hash'
          - hash

      kernel-url:
        description: 'Kernel Source URL'
        default: 'https://github.com/kyzuna28/bka.git'
        required: true
        type: string

      kernel-branch:
        description: 'Kernel Source Branch'
        default: 'nse'
        required: true
        type: string

      anykernel-url:
        description: 'AnyKernel3 Repository URL'
        default: 'https://github.com/kyzuna28/AnyKernel3.git'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.ubuntu }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REPO_RAW: 'https://raw.githubusercontent.com/kyzuna28/Compiler/main'
      REPO_API: 'https://api.github.com/repos/kyzuna28/Compiler/git/trees/main?recursive=1'

    steps:

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: 🧹 Clean Environment & Install Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune -af || true

          sudo apt-get update

          sudo apt-get install --no-install-recommends -y \
            gcc-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu \
            lld \
            llvm \
            g++-aarch64-linux-gnu \
            bc \
            aria2 \
            zip \
            unzip \
            tar \
            libssl-dev \
            flex \
            bison \
            git \
            git-lfs \
            libelf-dev \
            python3 \
            libdata-dump-perl \
            libtinfo-dev \
            libncurses5-dev \
            libncurses6 \
            zstd \
            curl \
            wget \
            patch \
            lsb-release \
            software-properties-common \
            gnupg

          if [[ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]]; then
            sudo ln -sf \
              /lib/x86_64-linux-gnu/libtinfo.so.6 \
              /lib/x86_64-linux-gnu/libtinfo.so.5
          else
            sudo apt-get install --no-install-recommends -y \
              libtinfo5 || true
          fi

      # ============================================================
      # SWAP
      # ============================================================
      - name: 💽 Setup Dynamic Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true

          if [[ "${{ inputs.lto_mode }}" == "full" ]]; then
            SWAP_SIZE="16G"
          else
            SWAP_SIZE="8G"
          fi

          echo "💽 Swap Size: $SWAP_SIZE"

          sudo fallocate -l "$SWAP_SIZE" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          free -h

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: 🛠️ Download Toolchain
        run: |
          rm -rf "$HOME/tc"
          mkdir -p "$HOME/tc"

          cd "$HOME"

          case "${{ inputs.compiler }}" in

            zyc-clang)
              git clone \
                --depth=1 \
                -b 21 \
                https://gitlab.com/clangsantoni/zyc_clang.git \
                tc
              ;;

            yuki-clang)
              git clone \
                --depth=1 \
                -b 18.0.0 \
                https://gitlab.com/TheXPerienceProject/yuki_clang.git \
                tc
              ;;

            weebx-clang)
              curl -sL \
                'https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz' |
                tar -xz -C tc
              ;;

            neutron-clang)
              cd tc

              curl -sLO \
                'https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman'

              chmod +x antman

              ./antman -S=10032024
              ;;

            aosp-clang)
              git clone \
                --depth=1 \
                -b 15.0 \
                https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
                tc
              ;;

            debian-clang)
              wget -qO- \
                https://apt.llvm.org/llvm.sh |
                sudo bash -s 21

              sudo apt-get install \
                --no-install-recommends \
                -y \
                clang-21 \
                lld-21 \
                llvm-21

              mkdir -p tc/bin

              cat > tc/bin/clang <<'EOF'
          #!/bin/bash
          if [[ "$1" == "--version" || "$1" == "-v" ]]; then
            echo "Debian clang version 21.1.8"
            echo "Target: aarch64-unknown-linux-gnu"
            exit 0
          fi
          exec /usr/bin/clang-21 "$@"
          EOF

              cat > tc/bin/clang++ <<'EOF'
          #!/bin/bash
          exec /usr/bin/clang++-21 "$@"
          EOF

              cat > tc/bin/ld.lld <<'EOF'
          #!/bin/bash
          if [[ "$1" == "--version" || "$1" == "-v" ]]; then
            echo "Debian LLD 21.1.8"
            exit 0
          fi
          exec /usr/bin/ld.lld-21 "$@"
          EOF

              chmod +x tc/bin/*

              for tool in ar nm objcopy objdump readelf strip; do
                if [[ -x "/usr/bin/llvm-$tool-21" ]]; then
                  ln -sf \
                    "/usr/bin/llvm-$tool-21" \
                    "tc/bin/llvm-$tool"
                fi
              done
              ;;

            *)
              echo "❌ Unknown compiler: ${{ inputs.compiler }}"
              exit 1
              ;;

          esac

          echo "🔧 Toolchain:"
          export PATH="$HOME/tc/bin:$PATH"

          command -v clang || true
          command -v ld.lld || true

          clang --version || true
          ld.lld --version || true

      # ============================================================
      # CLONE KERNEL
      # ============================================================
      - name: 📂 Clone Kernel Source
        run: |
          git clone \
            --depth=1 \
            "${{ inputs.kernel-url }}" \
            -b "${{ inputs.kernel-branch }}" \
            kernel-dir

          cd kernel-dir

          git submodule update \
            --init \
            --recursive || true

      # ============================================================
      # CONFIG PREPARATION
      # ============================================================
      - name: 🔀 Prepare Merge / Single Config
        run: |
          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          CONFIG_INPUT="${{ inputs.kernel-config }}"
          IS_MERGE="${{ inputs.merge_config }}"

          BASE_DIR="arch/arm64/configs"

          echo "=========================================="
          echo "CONFIG PREPARATION"
          echo "=========================================="
          echo "Input : $CONFIG_INPUT"
          echo "Merge : $IS_MERGE"

          if [[ "$IS_MERGE" == "true" ]]; then

            IFS=',' read -ra CONF_FILES <<< "$CONFIG_INPUT"

            for i in "${!CONF_FILES[@]}"; do
              CONF_FILES[$i]=$(echo "${CONF_FILES[$i]}" | xargs)
            done

            BASE_CONF="${CONF_FILES[0]}"
            BASE_PATH="$BASE_DIR/vendor/xiaomi/$BASE_CONF"

            if [[ ! -f "$BASE_PATH" ]]; then
              echo "❌ Base config tidak ditemukan:"
              echo "   $BASE_PATH"
              exit 1
            fi

            MERGED_CONFIG="$BASE_DIR/kyzuna_merged_defconfig"

            cp \
              "$BASE_PATH" \
              "$MERGED_CONFIG"

            echo "📦 Base Config: $BASE_CONF"

            for ((i=1; i<${#CONF_FILES[@]}; i++)); do

              FRAG="${CONF_FILES[$i]}"
              FRAG_PATH="$BASE_DIR/vendor/xiaomi/$FRAG"

              if [[ -f "$FRAG_PATH" ]]; then
                echo "🔗 Merge Fragment: $FRAG"
                cat "$FRAG_PATH" >> "$MERGED_CONFIG"
              else
                echo "⚠️ Fragment tidak ditemukan: $FRAG"
              fi

            done

            MAKE_DEFCONFIG="kyzuna_merged_defconfig"
            TARGET_CONFIG="$MERGED_CONFIG"

          else

            CLEAN_CONF=$(echo "$CONFIG_INPUT" | xargs)

            if [[ "$CLEAN_CONF" == *.config ]]; then
              CLEAN_CONF="${CLEAN_CONF%.config}"
            fi

            if [[ -f "$BASE_DIR/$CLEAN_CONF" ]]; then

              MAKE_DEFCONFIG="$CLEAN_CONF"
              TARGET_CONFIG="$BASE_DIR/$CLEAN_CONF"

            elif [[ -f "$BASE_DIR/vendor/xiaomi/$CLEAN_CONF" ]]; then

              MAKE_DEFCONFIG="kyzuna_single_defconfig"
              TARGET_CONFIG="$BASE_DIR/$MAKE_DEFCONFIG"

              cp \
                "$BASE_DIR/vendor/xiaomi/$CLEAN_CONF" \
                "$TARGET_CONFIG"

            else

              echo "❌ Config tidak ditemukan:"
              echo "   $CLEAN_CONF"
              exit 1

            fi

          fi

          echo "MAKE_DEFCONFIG=$MAKE_DEFCONFIG" >> "$GITHUB_ENV"
          echo "TARGET_CONFIG=$TARGET_CONFIG" >> "$GITHUB_ENV"

          echo ""
          echo "✅ MAKE_DEFCONFIG = $MAKE_DEFCONFIG"
          echo "✅ TARGET_CONFIG   = $TARGET_CONFIG"

          # ========================================================
          # VERSION / LOCALVERSION
          # ========================================================

          sed -i \
            's/^EXTRAVERSION.*/EXTRAVERSION =/g' \
            Makefile

          CLEAN_KERNEL=$(echo "${{ inputs.kernel_name }}" | xargs)
          CLEAN_ROM=$(echo "${{ inputs.rom_type }}" | xargs)

          if [[ -z "$CLEAN_KERNEL" ]]; then
            CLEAN_KERNEL="none"
          fi

          if [[ -z "$CLEAN_ROM" ]]; then
            CLEAN_ROM="none"
          fi

          echo ""
          echo "=========================================="
          echo "VERSION CONFIGURATION"
          echo "=========================================="
          echo "Kernel Name : $CLEAN_KERNEL"
          echo "ROM Type    : $CLEAN_ROM"
          echo "=========================================="

          if [[ "$CLEAN_KERNEL" == "none" ]] &&
             [[ "$CLEAN_ROM" == "none" ]]; then

            echo "⏭️ Kernel/ROM naming disabled."
            echo "⏭️ Existing CONFIG_LOCALVERSION will be preserved."

          else

            if [[ -f "$TARGET_CONFIG" ]]; then
              sed -i \
                's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/g' \
                "$TARGET_CONFIG"
            fi

            echo "📝 Custom kernel/ROM LOCALVERSION enabled."

          fi

          # ========================================================
          # COMPILER INFORMATION
          # ========================================================

          COMPILER_CUSTOM_ENABLE="${{ inputs.custom_compiler_name_enable }}"
          COMPILER_CUSTOM_NAME="${{ inputs.custom_compiler_name }}"

          if [[ "$COMPILER_CUSTOM_ENABLE" == "true" ]] &&
             [[ -n "$COMPILER_CUSTOM_NAME" ]] &&
             [[ "$COMPILER_CUSTOM_NAME" != "none" ]]; then

            COMPILER_NAME="$COMPILER_CUSTOM_NAME"

            echo "🧬 Custom compiler name: ENABLED"
            echo "📝 Compiler name: $COMPILER_NAME"

          else

            COMPILER_NAME="${{ inputs.compiler }}"

            COMPILER_NAME=$(
              echo "$COMPILER_NAME" |
              awk -F'-' \
              '{print toupper(substr($1,1,1)) substr($1,2) " Clang"}'
            )

            echo "🧬 Custom compiler name: DISABLED"
            echo "📝 Compiler name: $COMPILER_NAME"

          fi

          RAW_CLANG_VER=$(
            clang --version 2>/dev/null |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1
          )

          RAW_LLD_VER=$(
            ld.lld --version 2>/dev/null |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1
          )

          RAW_CLANG_VER="${RAW_CLANG_VER:-Custom}"
          RAW_LLD_VER="${RAW_LLD_VER:-$RAW_CLANG_VER}"

          CUSTOM_COMPILER_STRING="${COMPILER_NAME} ${RAW_CLANG_VER} ✦ Pipeline: pgo • autofdo • bolt • propeller • thinlto • mlgo • polly • -o3 ✦ LLD ${RAW_LLD_VER}"

          echo "CUSTOM_COMPILER_STRING=$CUSTOM_COMPILER_STRING" >> "$GITHUB_ENV"

          echo ""
          echo "🧬 Compiler:"
          echo "$CUSTOM_COMPILER_STRING"

      # ============================================================
      # PRE-KSU TWEAK
      # ============================================================
      - name: 🧩 Apply Tweak .sh / .patch (Pre-KSU)
        run: |
          cd kernel-dir

          INPUT_STRING="${{ inputs.custom_tweaks }}"

          if [[ "$INPUT_STRING" == "none" || -z "$INPUT_STRING" ]]; then
            echo "⏭️ No Pre-KSU tweak."
            exit 0
          fi

          REPO_TREE_CACHE=$(
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "$REPO_API" |
            grep -o '"path": "[^"]*"' |
            cut -d'"' -f4
          )

          IFS=',' read -ra FILES <<< "$INPUT_STRING"

          for file in "${FILES[@]}"; do

            file=$(echo "$file" | xargs)

            [[ -z "$file" ]] && continue

            FILE_PATH=$(
              echo "$REPO_TREE_CACHE" |
              grep -E "(^|/)$file$" |
              head -n 1
            )

            if [[ -z "$FILE_PATH" ]]; then
              echo "❌ Tweak tidak ditemukan: $file"
              exit 1
            fi

            echo "✅ Applying: $file"

            wget -q \
              "$REPO_RAW/$FILE_PATH" \
              -O "$file"

            if [[ "$file" == *.patch ]]; then

              patch -p1 < "$file" || exit 1

            elif [[ "$file" == *.sh ]]; then

              chmod +x "$file"
              bash "$file" || exit 1

            fi

          done

      # ============================================================
      # KSU
      # ============================================================
      - name: 👑 Config & Install KSU
        run: |
          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          KSU_CHOICE="${{ inputs.kernelsu }}"
          SUSFS_ENABLE="${{ inputs.susfs_enable }}"

          set_cfg() {
            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then
              echo "CONFIG_${cfg}=y" >> "$TARGET_CONFIG"
            else
              echo "# CONFIG_${cfg} is not set" >> "$TARGET_CONFIG"
            fi
          }

          enable_cfg() {
            for cfg in "$@"; do
              set_cfg "$cfg" y
            done
          }

          disable_cfg() {
            for cfg in "$@"; do
              set_cfg "$cfg" n
            done
          }

          echo "=========================================="
          echo "KSU: $KSU_CHOICE"
          echo "=========================================="

          if [[ "$KSU_CHOICE" == "none" ]]; then

            echo "🧹 Root method disabled."

          elif [[ "$KSU_CHOICE" == "apatch" ]]; then

            echo "🧬 APatch configuration..."

            enable_cfg \
              KALLSYMS \
              KALLSYMS_ALL \
              KALLSYMS_BASE_RELATIVE \
              KPROBES \
              HAVE_KPROBES

          else

            echo "🔑 Installing KernelSU..."

            enable_cfg KSU

            case "$KSU_CHOICE" in

              sorayukii)
                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s hookless || exit 1

                enable_cfg \
                  KSU_EXTRAS \
                  KSU_TAMPER_SYSCALL_TABLE

                disable_cfg KPROBES
                ;;

              mr-morat)
                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s syscall || exit 1

                enable_cfg \
                  KSU_EXTRAS \
                  KSU_TAMPER_SYSCALL_TABLE

                disable_cfg KPROBES
                ;;

              enjoy)
                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s enjoy || exit 1

                enable_cfg KSU_MANUAL_HOOK

                disable_cfg \
                  KPROBES \
                  HAVE_KPROBES
                ;;

              legacy)
                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s legacy || exit 1

                enable_cfg KSU_MANUAL_HOOK

                disable_cfg \
                  KPROBES \
                  HAVE_KPROBES
                ;;

              sukisu)
                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s resukisu || exit 1

                if [[ "$SUSFS_ENABLE" != "true" ]]; then
                  enable_cfg KSU_MANUAL_HOOK
                fi
                ;;

              next)
                curl -LSs \
                  'https://raw.githubusercontent.com/kyzuna28/KernelSU-Next/legacy/kernel/setup.sh' |
                  bash -s legacy-susfs-v2 || exit 1

                enable_cfg KSU_MANUAL_HOOK
                ;;

              resukisu)
                curl -LSs \
                  'https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh' |
                  bash -s main || exit 1

                if [[ "$SUSFS_ENABLE" != "true" ]]; then
                  enable_cfg KSU_MANUAL_HOOK
                fi
                ;;

              thre)
                curl -LSs \
                  'https://raw.githubusercontent.com/ThRE-Team/KernelSU-Next/main/kernel/setup.sh' |
                  bash -s main || exit 1

                disable_cfg \
                  KPROBES \
                  HAVE_KPROBES

                enable_cfg KSU_MANUAL_HOOK
                ;;

              *)
                echo "❌ Unknown KSU method: $KSU_CHOICE"
                exit 1
                ;;

            esac

          fi

      # ============================================================
      # SUSFS CUSTOM
      # ============================================================
      - name: 🪝 Apply SuSFS Script / Patch
        run: |
          cd kernel-dir

          INPUT_STRING="${{ inputs.susfs_custom }}"

          if [[ "$INPUT_STRING" == "none" || -z "$INPUT_STRING" ]]; then
            echo "⏭️ No SuSFS custom patch."
            exit 0
          fi

          REPO_TREE_CACHE=$(
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "$REPO_API" |
            grep -o '"path": "[^"]*"' |
            cut -d'"' -f4
          )

          IFS=',' read -ra FILES <<< "$INPUT_STRING"

          for file in "${FILES[@]}"; do

            file=$(echo "$file" | xargs)

            [[ -z "$file" ]] && continue

            FILE_PATH=$(
              echo "$REPO_TREE_CACHE" |
              grep -E "(^|/)$file$" |
              head -n 1
            )

            if [[ -z "$FILE_PATH" ]]; then
              echo "❌ SuSFS file tidak ditemukan: $file"
              exit 1
            fi

            echo "✅ Applying SuSFS: $file"

            wget -q \
              "$REPO_RAW/$FILE_PATH" \
              -O "$file"

            if [[ "$file" == *.patch ]]; then

              patch -p1 < "$file" || {
                echo "⚠️ Patch menghasilkan reject."
                echo "⚠️ Build tetap dilanjutkan."
              }

            elif [[ "$file" == *.sh ]]; then

              chmod +x "$file"
              bash "$file" || exit 1

            fi

          done

      # ============================================================
      # SUSFS CONFIG
      # ============================================================
      - name: 🛡️ Configure SuSFS
        run: |
          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          SUSFS_ENABLE="${{ inputs.susfs_enable }}"

          set_cfg() {
            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then
              echo "CONFIG_${cfg}=y" >> "$TARGET_CONFIG"
            else
              echo "# CONFIG_${cfg} is not set" >> "$TARGET_CONFIG"
            fi
          }

          enable_cfg() {
            for cfg in "$@"; do
              set_cfg "$cfg" y
            done
          }

          disable_cfg() {
            for cfg in "$@"; do
              set_cfg "$cfg" n
            done
          }

          if [[ "$SUSFS_ENABLE" == "true" ]]; then

            echo "🛡️ Enabling SuSFS..."

            enable_cfg \
              KSU_SUSFS \
              KSU_SUSFS_SUS_PATH \
              KSU_SUSFS_SUS_MOUNT \
              KSU_SUSFS_SUS_KSTAT \
              KSU_SUSFS_SPOOF_UNAME \
              KSU_SUSFS_ENABLE_LOG \
              KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              KSU_SUSFS_OPEN_REDIRECT \
              KSU_SUSFS_SUS_MAP

            if grep -q "THREAD_INFO_IN_TASK" \
              drivers/kernelsu/Kconfig 2>/dev/null; then

              enable_cfg THREAD_INFO_IN_TASK

            fi

          else

            echo "🛑 SuSFS disabled."

            disable_cfg KSU_SUSFS

          fi

      # ============================================================
      # CUSTOM HOOK
      # ============================================================
      - name: 💉 Apply Custom Hook Script / Patch
        run: |
          cd kernel-dir

          INPUT_STRING="${{ inputs.custom_hooks }}"

          if [[ "$INPUT_STRING" == "none" || -z "$INPUT_STRING" ]]; then
            echo "⏭️ No custom hook."
            exit 0
          fi

          REPO_TREE_CACHE=$(
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              "$REPO_API" |
            grep -o '"path": "[^"]*"' |
            cut -d'"' -f4
          )

          IFS=',' read -ra FILES <<< "$INPUT_STRING"

          for file in "${FILES[@]}"; do

            file=$(echo "$file" | xargs)

            [[ -z "$file" ]] && continue

            FILE_PATH=$(
              echo "$REPO_TREE_CACHE" |
              grep -E "(^|/)$file$" |
              head -n 1
            )

            if [[ -z "$FILE_PATH" ]]; then
              echo "❌ Hook tidak ditemukan: $file"
              exit 1
            fi

            echo "✅ Applying Hook: $file"

            wget -q \
              "$REPO_RAW/$FILE_PATH" \
              -O "$file"

            if [[ "$file" == *.patch ]]; then

              patch -p1 < "$file" || exit 1

            elif [[ "$file" == *.sh ]]; then

              chmod +x "$file"
              bash "$file" || exit 1

            fi

          done

      # ============================================================
      # LTO
      # ============================================================
      - name: 🚀 Setup LTO Optimization
        run: |
          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          LTO_MODE="${{ inputs.lto_mode }}"

          set_cfg() {
            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then
              echo "CONFIG_${cfg}=y" >> "$TARGET_CONFIG"
            else
              echo "# CONFIG_${cfg} is not set" >> "$TARGET_CONFIG"
            fi
          }

          enable_cfg() {
            for cfg in "$@"; do
              set_cfg "$cfg" y
            done
          }

          disable_cfg() {
            for cfg in "$@"; do
              set_cfg "$cfg" n
            done
          }

          echo "🧬 LTO Mode: $LTO_MODE"

          disable_cfg \
            LTO \
            LTO_CLANG \
            LTO_CLANG_FULL \
            LTO_CLANG_THIN \
            THINLTO \
            LTO_NONE

          case "$LTO_MODE" in

            full)
              enable_cfg \
                LTO \
                LTO_CLANG \
                LTO_CLANG_FULL
              ;;

            thin)
              enable_cfg \
                LTO \
                LTO_CLANG \
                LTO_CLANG_THIN \
                THINLTO
              ;;

            "no lto")
              enable_cfg LTO_NONE
              ;;

            *)
              echo "❌ Unknown LTO mode: $LTO_MODE"
              exit 1
              ;;

          esac

      # ============================================================
      # EXTRA CONFIG
      # ============================================================
      - name: 🛠️ Apply Extra Config
        run: |
          cd kernel-dir

          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          EXTRA_CONFIG="${{ inputs.extra_config }}"

          if [[ "$EXTRA_CONFIG" == "none" || -z "$EXTRA_CONFIG" ]]; then
            echo "⏭️ No extra config."
            exit 0
          fi

          set_cfg() {
            local cfg="$1"
            local value="$2"

            sed -i \
              "/^CONFIG_${cfg}=/d" \
              "$TARGET_CONFIG"

            sed -i \
              "/^# CONFIG_${cfg} is not set$/d" \
              "$TARGET_CONFIG"

            if [[ "$value" == "y" ]]; then
              echo "CONFIG_${cfg}=y" >> "$TARGET_CONFIG"
            else
              echo "# CONFIG_${cfg} is not set" >> "$TARGET_CONFIG"
            fi
          }

          IFS=',' read -ra CONFIGS <<< "$EXTRA_CONFIG"

          for CFG in "${CONFIGS[@]}"; do

            CFG=$(echo "$CFG" | xargs)

            [[ -z "$CFG" ]] && continue

            CFG=$(echo "$CFG" | tr '[:lower:]' '[:upper:]')

            if [[ "$CFG" == CONFIG_* ]]; then
              CFG="${CFG#CONFIG_}"
            fi

            if [[ "$CFG" == -* ]]; then

              CFG="${CFG#-}"

              echo "❌ Disable: CONFIG_$CFG"

              set_cfg "$CFG" n

            elif [[ "$CFG" == *=N ]]; then

              CFG="${CFG%=N}"

              echo "❌ Disable: CONFIG_$CFG"

              set_cfg "$CFG" n

            elif [[ "$CFG" == *=Y ]]; then

              CFG="${CFG%=Y}"

              echo "✅ Enable: CONFIG_$CFG"

              set_cfg "$CFG" y

            else

              echo "✅ Enable: CONFIG_$CFG"

              set_cfg "$CFG" y

            fi

          done

      # ============================================================
      # COMPILE
      # ============================================================
      - name: 🔨 Compile Kernel
        run: |
          cd kernel-dir

          export PATH="$HOME/tc/bin:$PATH"

          export KBUILD_BUILD_USER="${{ inputs.project_name }}"
          export KBUILD_BUILD_HOST="project"
          export KBUILD_COMPILER_STRING="$CUSTOM_COMPILER_STRING"

          export LLVM_PARALLEL=1

          if [[ "${{ inputs.version_hash }}" == "no hash" ]]; then
            echo "" > .scmversion
            export LOCALVERSION_AUTO=""
          else
            rm -f .scmversion
          fi

          rm -rf ../out
          mkdir -p ../out

          BASENAME_CONFIG="${{ env.MAKE_DEFCONFIG }}"

          if [[ ! -f "arch/arm64/configs/$BASENAME_CONFIG" ]]; then
            echo "❌ Defconfig tidak ditemukan:"
            echo "   arch/arm64/configs/$BASENAME_CONFIG"
            exit 1
          fi

          echo "⚙️ Running defconfig:"
          echo "$BASENAME_CONFIG"

          make \
            -s \
            ARCH=arm64 \
            O=../out \
            "$BASENAME_CONFIG"

          EXTRA_CFLAGS=""

          if [[ "${{ inputs.compiler }}" == "debian-clang" ]]; then
            EXTRA_CFLAGS="--target=aarch64-linux-gnu"
          fi

          OPTIMIZATION_FLAGS="-O3"

          CORES=$(nproc --all)

          MAKE_JOBS=$(( (CORES + 1) / 2 ))

          if [[ "${{ inputs.lto_mode }}" == "full" ]]; then
            MAKE_JOBS=2
          fi

          if [[ "$MAKE_JOBS" -lt 2 ]]; then
            MAKE_JOBS=2
          fi

          if [[ "$MAKE_JOBS" -gt 8 ]]; then
            MAKE_JOBS=8
          fi

          CLEAN_ROM=$(echo "${{ inputs.rom_type }}" | xargs)
          CLEAN_KERNEL=$(echo "${{ inputs.kernel_name }}" | xargs)

          if [[ -z "$CLEAN_ROM" ]]; then
            CLEAN_ROM="none"
          fi

          if [[ -z "$CLEAN_KERNEL" ]]; then
            CLEAN_KERNEL="none"
          fi

          LOCALVERSION=""

          if [[ "$CLEAN_KERNEL" != "none" ]]; then
            LOCALVERSION="$LOCALVERSION-$CLEAN_KERNEL"
          fi

          if [[ "$CLEAN_ROM" != "none" ]]; then
            LOCALVERSION="$LOCALVERSION-$CLEAN_ROM"
          fi

          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="
          echo "CPU Cores : $CORES"
          echo "Jobs      : $MAKE_JOBS"
          echo "Compiler  : $(clang --version | head -n 1)"
          echo "LLD       : $(ld.lld --version | head -n 1)"
          echo "LTO       : ${{ inputs.lto_mode }}"
          echo "Kernel    : $CLEAN_KERNEL"
          echo "ROM       : $CLEAN_ROM"
          echo "LocalVer  : ${LOCALVERSION:-<empty>}"
          echo "=========================================="

          set -o pipefail

          make \
            -j"$MAKE_JOBS" \
            ARCH=arm64 \
            O=../out \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            LD=ld.lld \
            HOSTLD=ld.lld \
            AR=llvm-ar \
            HOSTAR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="$LOCALVERSION" \
            KCFLAGS="$OPTIMIZATION_FLAGS -w -Qunused-arguments $EXTRA_CFLAGS" \
            HOSTCFLAGS="-w" \
            Image.gz \
            Image.gz-dtb \
            dtbs \
            2>&1 |
            grep -vE \
              'clang: warning:|ld.lld: warning:|Broken pipe|no symbols' \
            || {
              echo "❌ [ERROR] Kompilasi gagal!"
              exit 1
            }

          KERNEL_DIR="../out/arch/arm64/boot"

          if [[ -s "$KERNEL_DIR/Image.gz" ]]; then

            echo "✅ Image.gz berhasil dibuat."

          elif [[ -s "$KERNEL_DIR/Image.gz-dtb" ]]; then

            echo "✅ Image.gz-dtb berhasil dibuat."

          else

            echo "❌ Image kernel tidak ditemukan."
            exit 1

          fi

      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: 📦 Package with AnyKernel3
        run: |
          echo "📥 Cloning AnyKernel3..."

          git clone \
            --depth=1 \
            "${{ inputs.anykernel-url }}" \
            AnyKernel3

          cd AnyKernel3

          rm -rf \
            .git \
            .github \
            LICENSE \
            README.md \
            modules \
            patch \
            ramdisk

          rm -f \
            *.txt \
            *.md \
            *placeholder

          cd ..

          KERNEL_DIR="out/arch/arm64/boot"

          echo "⚙️ Preparing kernel..."

          if [[ \
            -f "$KERNEL_DIR/Image.gz" &&
            -f "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb"
          ]]; then

            echo "📦 Creating Image.gz-dtb..."

            cat \
              "$KERNEL_DIR/Image.gz" \
              "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" \
              > AnyKernel3/Image.gz-dtb

          elif [[ -f "$KERNEL_DIR/Image.gz-dtb" ]]; then

            echo "✅ Using existing Image.gz-dtb."

            cp \
              "$KERNEL_DIR/Image.gz-dtb" \
              AnyKernel3/

          elif [[ -f "$KERNEL_DIR/Image-dtb" ]]; then

            echo "✅ Using existing Image-dtb."

            cp \
              "$KERNEL_DIR/Image-dtb" \
              AnyKernel3/

          elif [[ -f "$KERNEL_DIR/Image.gz" ]]; then

            echo "✅ Using Image.gz."

            cp \
              "$KERNEL_DIR/Image.gz" \
              AnyKernel3/

          elif [[ -f "$KERNEL_DIR/Image" ]]; then

            echo "⚠️ Image.gz not found."
            echo "🗜️ Compressing Image..."

            gzip -n -9 \
              < "$KERNEL_DIR/Image" \
              > AnyKernel3/Image.gz

          else

            echo "❌ Kernel Image tidak ditemukan."
            exit 1

          fi

          if [[ -f "$KERNEL_DIR/dtbo.img" ]]; then

            echo "💾 Copying dtbo.img..."

            cp \
              "$KERNEL_DIR/dtbo.img" \
              AnyKernel3/

          fi

          echo "🔍 Verifying package..."

          if ls AnyKernel3/Image* >/dev/null 2>&1; then

            echo "✨ Kernel berhasil dipaketkan."

          else

            echo "❌ Image tidak ditemukan di AnyKernel3."
            exit 1

          fi

          CLEAN_ZIP_NAME=$(
            echo "${{ inputs.zip_name }}" |
            tr ' ' '_'
          )

          echo "FINAL_ARTIFACT_NAME=$CLEAN_ZIP_NAME" >> "$GITHUB_ENV"

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: '${{ env.FINAL_ARTIFACT_NAME }}'
          path: AnyKernel3/
          compression-level: 9
          if-no-files-found: error
          
