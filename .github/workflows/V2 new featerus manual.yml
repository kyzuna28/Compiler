# Linex Project - Customized for Poco F1 (beryllium)
name: se nse new feature manual
run-name: 🚀 ${{ inputs.zip_name }} | ${{ inputs.kernel_name }} | Hash:${{ inputs.version_hash }} | SU:${{ inputs.su_version }}

on:
  workflow_dispatch:
    inputs:
      ubuntu:
        default: 'ubuntu-24.04'
        required: true
        type: string
      zip_name:
        default: 'Beryllium'
        required: true
        type: string
      kernel_name:
        default: 'cip128-st12'
        required: true
        type: string
      rom_type:
        default: 'Kyy'
        required: true
        type: string
      project_name:
        default: 'selea×kyy'
        required: true
        type: string
      compiler:
        default: 'debian-clang'
        required: true
        type: choice
        options:
        - zyc-clang
        - yuki-clang
        - weebx-clang
        - aosp-clang
        - debian-clang
      lto_mode:
        default: 'disable'
        required: true
        type: choice
        options:
        - disable
        - full
        - thin
      rom_optimization:
        default: 'AOSP'
        required: true
        type: choice
        options:
        - AOSP
        - MIUI
        - disable
      su_mode:
        default: 'disable'
        required: true
        type: choice
        options:
        - disable
        - kernelsunext
        - resukisu
        - sukisu_ultra
      su_version:
        default: 'old'
        required: true
        type: choice
        options:
        - new
        - old
      version_hash:
        default: 'disable'
        required: true
        type: choice
        options:
        - disable
        - enable
      kernel-url:
        default: 'https://github.com/kyzuna28/pixelos_beryllium_kernel.git'
        required: true
        type: string
      kernel-branch:
        default: 'susfsarrow'
        required: true
        type: string
      kernel-config:
        default: 'beryllium_defconfig'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.ubuntu }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Clean Environment
      run: |
         sudo timedatectl set-timezone Asia/Jakarta
         sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
         sudo docker image prune --all --force

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
         sudo apt-get update
         sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu lld llvm g++-aarch64-linux-gnu bc aria2 zip tar libssl-dev flex bison git git-lfs libelf-dev python3 libdata-dump-perl libtinfo-dev libncurses5-dev zstd libncurses6 curl wget patch
         
         if [ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]; then
             sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
             sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.6.0 || true
         else
             sudo apt-get install --no-install-recommends -y libtinfo5 || true
         fi

    - name: Setup Swap Space (16GB)
      run: |
         sudo swapoff -a || true
         sudo rm -f /mnt/swapfile || true
         sudo fallocate -l 16G /mnt/swapfile
         sudo chmod 600 /mnt/swapfile
         sudo mkswap /mnt/swapfile
         sudo swapon /mnt/swapfile

    - name: Download Toolchain
      run: |
         rm -rf $HOME/tc $HOME/tmp-tc && mkdir -p $HOME/tc
         echo "Mengunduh Clang (${{ inputs.compiler }})..."
         
         if [ "${{ inputs.compiler }}" = "zyc-clang" ]; then
             git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git -b 21 $HOME/tc
         elif [ "${{ inputs.compiler }}" = "yuki-clang" ]; then
             git clone --depth=1 https://gitlab.com/TheXPerienceProject/yuki_clang.git -b 18.0.0 $HOME/tc
         elif [ "${{ inputs.compiler }}" = "weebx-clang" ]; then
             mkdir -p $HOME/tc
             wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz -O weebx-clang.tar.gz
             tar -xf weebx-clang.tar.gz -C $HOME/tc
             rm -f weebx-clang.tar.gz
         elif [ "${{ inputs.compiler }}" = "aosp-clang" ]; then
             git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git -b 15.0 $HOME/tc
         elif [ "${{ inputs.compiler }}" = "debian-clang" ]; then
             sudo apt-get install --no-install-recommends -y clang lld llvm
             mkdir -p $HOME/tc/bin
             for cmd in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump; do
                 ln -sf /usr/bin/$cmd $HOME/tc/bin/$cmd
             done
         fi

    - name: Clone Kernel Source
      run: git clone --depth=1 ${{ inputs.kernel-url }} -b ${{ inputs.kernel-branch }} kernel-dir

    - name: Apply Patch & Setup SU
      run: |
         cd kernel-dir
         
         # 1. 🚀 EKSEKUSI PATCH MANUAL HOOK DULUAN SEBELUM KSU
         if [ "${{ inputs.su_mode }}" != "disable" ]; then
             echo "Menerapkan Patch Manual Hook 4.4/4.9 terlebih dahulu..."
             wget https://raw.githubusercontent.com/rksuorg/kernel_patches/refs/heads/master/manual_hook/kernel-4.4_4.9.patch
             patch -p1 -N < kernel-4.4_4.9.patch || true
         fi

         # 2. 🚀 BARU INSTALL KSU SCRIPT-NYA
         if [ "${{ inputs.su_mode }}" = "kernelsunext" ]; then
             BRANCH=$([ "${{ inputs.su_version }}" = "new" ] && echo "main" || echo "legacy")
             echo "Menginstal KernelSU-Next ($BRANCH)..."
             curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/$BRANCH/kernel/setup.sh" | bash -s $BRANCH
             
         elif [ "${{ inputs.su_mode }}" = "resukisu" ]; then
             BRANCH=$([ "${{ inputs.su_version }}" = "new" ] && echo "dev" || echo "main")
             echo "Menginstal ResukiSU ($BRANCH)..."
             curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/$BRANCH/kernel/setup.sh" | bash -s $BRANCH
             
         elif [ "${{ inputs.su_mode }}" = "sukisu_ultra" ]; then
             BRANCH=$([ "${{ inputs.su_version }}" = "new" ] && echo "main" || echo "old")
             echo "Menginstal SukiSU Ultra ($BRANCH)..."
             curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/$BRANCH/kernel/setup.sh" | bash -s $BRANCH
             
         elif [ "${{ inputs.su_mode }}" = "disable" ]; then
             echo "SU Disabled: Mencegah file not found ksu_trace.h..."
             curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
         fi
         
         # 3. 🚀 FIX ERROR MODULE_IMPORT_NS & TWA_RESUME UNTUK KERNEL 4.9 MODIFIED
         if [ -f drivers/kernelsu/ksu.c ]; then
             echo "Bypass MODULE_IMPORT_NS untuk Kernel 4.9..."
             sed -i 's/MODULE_IMPORT_NS(.*);//g' drivers/kernelsu/ksu.c || true
         fi

         # Ganti semua TWA_RESUME menjadi true di seluruh source KernelSU
         echo "Bypass TWA_RESUME menjadi true untuk argumen ke-3 (bool)..."
         find drivers/kernelsu/ -type f -name "*.c" -exec sed -i 's/TWA_RESUME/true/g' {} + || true

         if [ -f drivers/kernelsu/Kbuild ]; then
             sed -i 's/$(error/$(warning/g' drivers/kernelsu/Kbuild || true
         fi
         
    - name: Tweak Defconfig
      run: |
         cd kernel-dir
         TARGET_CONFIG="arch/arm64/configs/${{ inputs.kernel-config }}"
         
         sed -i "s/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"\"/g" $TARGET_CONFIG || true
         
         if [ "${{ inputs.version_hash }}" = "enable" ]; then
             sed -i "s/# CONFIG_LOCALVERSION_AUTO is not set/CONFIG_LOCALVERSION_AUTO=y/g" $TARGET_CONFIG || true
             echo "CONFIG_LOCALVERSION_AUTO=y" >> $TARGET_CONFIG
             rm -f .scmversion out/.scmversion
             [ -f scripts/setlocalversion ] && sed -i 's/scm_version_string=""/scm_version_string="-dirty"/g' scripts/setlocalversion || true
         else
             sed -i "s/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g" $TARGET_CONFIG || true
             echo "CONFIG_LOCALVERSION_AUTO=n" >> $TARGET_CONFIG
             echo "" > .scmversion
             [ -f scripts/setlocalversion ] && sed -i 's/res="$res${scm:++}"/res="$res"/g' scripts/setlocalversion || true
             [ -f scripts/setlocalversion ] && sed -i 's/echo "+"/echo ""/g' scripts/setlocalversion || true
             [ -f scripts/setlocalversion ] && sed -i 's/scm_version_string="-dirty"/scm_version_string=""/g' scripts/setlocalversion || true
         fi
         
         for cfg in SECTION_MISMATCH_WARN_ONLY ANDROID_BINDERFS CGROUPS CGROUP_BPF MEMCG MEMCG_SWAP; do
             echo "CONFIG_$cfg=y" >> $TARGET_CONFIG
         done
         
         if [ "${{ inputs.rom_optimization }}" = "MIUI" ]; then
             for cfg in KCAL_EQ SOUND_CONTROL USB_FASTCHARGE DEVFREQ_GOV_MSM_ADRENO_TZ ZRAM ZCOMP CRYPTO_ZSTD ZRAM_DEF_COMP_ZSTD SIMPLE_LMK IOSCHED_MAPLE DEFAULT_MAPLE F2FS_FS EXFAT_FS BOEFFLA_WL_BLOCKER STATE_NOTIFIER POWER_SUSPEND POWER_SUSPEND_STATE NETFILTER_XT_TARGET_HL NETFILTER_XT_MATCH_HL; do
                 echo "CONFIG_$cfg=y" >> $TARGET_CONFIG
             done
             for cfg in MSM_KGSL_BATT_STATS DEBUG_KERNEL PROVE_LOCKING; do
                 sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" $TARGET_CONFIG || true
             done
             echo "CONFIG_MI_LOG_PRINT=n" >> $TARGET_CONFIG
             echo "CONFIG_MSM_SMD_DEBUG=n" >> $TARGET_CONFIG
             echo "CONFIG_DEBUG_INFO=n" >> $TARGET_CONFIG

         elif [ "${{ inputs.rom_optimization }}" = "AOSP" ]; then
             for cfg in KCAL_EQ SOUND_CONTROL USB_FASTCHARGE INPUT_TOUCHSCREEN DEVFREQ_GOV_MSM_ADRENO_TZ IOSCHED_ZEN DEFAULT_ZEN F2FS_FS EXFAT_FS SIMPLE_LMK TCP_CONG_BBR DEFAULT_BBR NET_SCH_FQ NETFILTER_XT_TARGET_HL NETFILTER_XT_MATCH_HL; do
                 echo "CONFIG_$cfg=y" >> $TARGET_CONFIG
             done
             echo 'CONFIG_DEFAULT_NET_SCH="fq"' >> $TARGET_CONFIG
             for cfg in MSM_KGSL_BATT_STATS DEBUG_KERNEL PROVE_LOCKING; do
                 sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" $TARGET_CONFIG || true
             done
             echo "CONFIG_DEBUG_INFO=n" >> $TARGET_CONFIG
         fi
         
         if [ "${{ inputs.su_mode }}" != "disable" ]; then
             echo "Mengaktifkan KSU & MANUAL_HOOK sesuai instruksi RKSUORG..."
             
             # 🚀 CRITICAL FIX: DONT ENABLE CONFIG_KPROBES!
             sed -i "s/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g" $TARGET_CONFIG || true
             sed -i "s/CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/g" $TARGET_CONFIG || true
             sed -i "s/CONFIG_KPROBE_EVENTS=y/# CONFIG_KPROBE_EVENTS is not set/g" $TARGET_CONFIG || true
             echo "# CONFIG_KPROBES is not set" >> $TARGET_CONFIG
             echo "# CONFIG_KPROBE_EVENTS is not set" >> $TARGET_CONFIG
             
             # 🚀 Add Config
             echo "CONFIG_KSU_MANUAL_HOOK=y" >> $TARGET_CONFIG
             echo "CONFIG_KSU=y" >> $TARGET_CONFIG
         fi

         if [ "${{ inputs.su_mode }}" = "disable" ]; then
             echo "# CONFIG_KSU is not set" >> $TARGET_CONFIG
             echo "CONFIG_KSU=n" >> $TARGET_CONFIG
             for cfg in OVERLAY_FS KALLSYMS KALLSYMS_ALL KALLSYMS_BASE_RELATIVE; do
                 echo "CONFIG_$cfg=y" >> $TARGET_CONFIG
             done
         fi
         
         for lto in LTO LTO_CLANG_FULL LTO_CLANG_THIN LTO_CLANG THINLTO LTO_NONE; do
             sed -i "s/CONFIG_$lto=.*/# CONFIG_$lto is not set/g" $TARGET_CONFIG || true
         done
         if [ "${{ inputs.lto_mode }}" = "full" ]; then
             echo -e "CONFIG_LTO=y\nCONFIG_LTO_CLANG=y\nCONFIG_LTO_CLANG_FULL=y" >> $TARGET_CONFIG
         elif [ "${{ inputs.lto_mode }}" = "thin" ]; then
             echo -e "CONFIG_LTO=y\nCONFIG_LTO_CLANG=y\nCONFIG_THINLTO=y\nCONFIG_LTO_CLANG_THIN=y" >> $TARGET_CONFIG
         else
             echo "CONFIG_LTO_NONE=y" >> $TARGET_CONFIG
         fi

    - name: Compile Kernel
      run: |
         cd kernel-dir
         export PATH=$HOME/tc/bin:$PATH
         export KBUILD_BUILD_USER="${{ inputs.project_name }}"
         export KBUILD_BUILD_HOST="project"
         
         rm -rf ../out && mkdir -p ../out
         make ARCH=arm64 O=../out ${{ inputs.kernel-config }}
         
         SAFE_CORES=$(( $(nproc --all) > 1 ? $(nproc --all) - 1 : 1 ))
         CLEAN_ROM=$(echo "${{ inputs.rom_type }}" | tr -d ' ')
         
         EXTRA_CFLAGS=""
         if [ "${{ inputs.compiler }}" = "debian-clang" ]; then
             EXTRA_CFLAGS="--target=aarch64-linux-gnu"
         fi
         
         make -j$SAFE_CORES ARCH=arm64 O=../out \
              CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- \
              LOCALVERSION="-${{ inputs.kernel_name }}-${CLEAN_ROM}" \
              KCFLAGS="-w -Wno-error -fno-builtin $EXTRA_CFLAGS" \
              Image.gz Image.gz-dtb dtbs 2>&1 | tee build.log
         
         if [ ! -f ../out/arch/arm64/boot/Image ] && [ ! -f ../out/arch/arm64/boot/Image.gz ] && [ ! -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "Build Failed!" && tail -n 50 build.log && exit 1
         fi

    - name: Collect Output Binaries
      run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_binaries
          cd out/arch/arm64/boot
          
          if [ -f "Image.gz-dtb" ]; then
              cp Image.gz-dtb $GITHUB_WORKSPACE/kernel_binaries/Image.gz-dtb
          elif [ -f "Image.gz" ]; then
              if [ -f "dts/qcom/sdm845-beryllium.dtb" ]; then
                  cat Image.gz dts/qcom/sdm845-beryllium.dtb > $GITHUB_WORKSPACE/kernel_binaries/Image.gz-dtb
              else
                  cp Image.gz $GITHUB_WORKSPACE/kernel_binaries/Image.gz
              fi
          fi
          
          [ -f "dtbo.img" ] && cp dtbo.img $GITHUB_WORKSPACE/kernel_binaries/dtbo.img || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "${{ inputs.zip_name }}-${{ inputs.rom_type }}-Binaries"
        path: kernel_binaries/**
        
