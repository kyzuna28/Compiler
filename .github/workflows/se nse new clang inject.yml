#Kyzuna Project - Customized for Poco F1 (beryllium)
name: non susfs ksun
run-name: 🚀 ${{ inputs.zip_name }} | ${{ inputs.kernel_name }} | ${{ inputs.compiler }}
on:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: 'Run on (ubuntu-24.04 / ubuntu-latest)'
        default: 'ubuntu-24.04'
        required: true
        type: string
      zip_name:
        description: 'Nama File Akhir'
        default: 'Team'
        required: true
        type: string
      kernel_version:
        description: 'Versi angka (misal 4.19.1) atau "original"'
        default: 'original'
        required: true
        type: string
      kernel_name:
        description: 'Nama Utama Kernel'
        default: 'cip128-st12'
        required: true
        type: string
      rom_type:
        description: 'Tipe ROM / Tag Cabang'
        default: 'Kyy'
        required: true
        type: string
      project_name:
        description: 'Build Project (@nama-project)'
        default: 'selea×kyy'
        required: true
        type: string
      compiler:
        description: 'Pilih Compiler Clang'
        default: 'aosp-clang'
        required: true
        type: choice
        options:
        - zyc-clang
        - yuki-clang
        - weebx-clang
        - aosp-clang
        - debian-clang
      lto_mode:
        description: 'Mode LTO (Link Time Optimization)'
        default: 'disable'
        required: true
        type: choice
        options:
        - disable
        - full
        - thin
      kernel-url:
        description: 'Kernel Source URL'
        default: 'https://github.com/kyzuna28/kyzuna_kernel.git'
        required: true
        type: string
      kernel-branch:
        description: 'Kernel Branch'
        default: 'T13'
        required: true
        type: string
      kernel-config:
        description: 'Kernel Defconfig'
        default: 'beryllium_defconfig'
        required: true
        type: string
      kernelsu:
        description: 'Mode Root (KernelSU-Next / Pilih false untuk Full APatch Support)'
        default: 'false'
        required: true
        type: choice
        options:
        - next-v3.0.0
        - next-v3.1.0
        - next-v3.2.0
        - "false"

jobs:
  build:
    runs-on: ${{ inputs.ubuntu }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Persiapan Lingkungan & Pembersihan Storage
      run: |
         sudo timedatectl set-timezone Asia/Jakarta
         sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
         sudo docker image prune --all --force
    - name: Checkout Workflow
      uses: actions/checkout@v4

    - name: Instalasi Dependensi
      run: |
         sudo apt-get update
         sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu lld llvm g++-aarch64-linux-gnu bc aria2 zip tar libssl-dev flex bison git git-lfs libelf-dev python3 libdata-dump-perl libtinfo-dev libncurses5-dev zstd libncurses6 curl wget
         
         if [ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]; then
             sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
             sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.6.0 || true
         else
             sudo apt-get install --no-install-recommends -y libtinfo5 || true
         fi
    - name: Opsi Kinerja Swap Space
      run: |
         sudo swapoff -a || true
         sudo rm -f /mnt/swapfile || true
         sudo fallocate -l 16G /mnt/swapfile
         sudo chmod 600 /mnt/swapfile
         sudo mkswap /mnt/swapfile
         sudo swapon /mnt/swapfile
    - name: Unduh Toolchains (GCC & Clang)
      run: |
         rm -rf $HOME/tc $HOME/gcc-64 $HOME/gcc-32 $HOME/tmp-tc
         mkdir -p $HOME/tc $HOME/gcc-64 $HOME/gcc-32
         
         echo "Mengunduh GCC LineageOS..."
         git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-19.1 $HOME/gcc-64
         git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git -b lineage-19.1 $HOME/gcc-32
         
         echo "Mengunduh Clang (${{ inputs.compiler }})..."
         if [ "${{ inputs.compiler }}" = "zyc-clang" ]; then
             git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git -b 21 $HOME/tc
         elif [ "${{ inputs.compiler }}" = "yuki-clang" ]; then
             git clone --depth=1 https://gitlab.com/TheXPerienceProject/yuki_clang.git -b 18.0.0 $HOME/tc
         elif [ "${{ inputs.compiler }}" = "weebx-clang" ]; then
             mkdir -p $HOME/tc
             wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz -O weebx-clang.tar.gz
             tar -xf weebx-clang.tar.gz -C $HOME/tc
             rm -f weebx-clang.tar.gz
         elif [ "${{ inputs.compiler }}" = "aosp-clang" ]; then
             git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git -b 15.0 $HOME/tc
         elif [ "${{ inputs.compiler }}" = "debian-clang" ]; then
             sudo apt-get install --no-install-recommends -y clang lld llvm
             mkdir -p $HOME/tc/bin
             ln -sf /usr/bin/clang $HOME/tc/bin/clang
             ln -sf /usr/bin/ld.lld $HOME/tc/bin/ld.lld
             ln -sf /usr/bin/llvm-ar $HOME/tc/bin/llvm-ar
             ln -sf /usr/bin/llvm-nm $HOME/tc/bin/llvm-nm
             ln -sf /usr/bin/llvm-objcopy $HOME/tc/bin/llvm-objcopy
             ln -sf /usr/bin/llvm-objdump $HOME/tc/bin/llvm-objdump
         fi
    - name: Clone Kernel Source
      run: git clone --depth=1 ${{ inputs.kernel-url }} -b ${{ inputs.kernel-branch }} kernel-dir

    - name: Konfigurasi Defconfig & Setting Root
      run: |
         cd kernel-dir
         
         if [ "${{ inputs.kernel_version }}" != "original" ] && [ "${{ inputs.kernel_version }}" != "" ]; then
             sed -i "s/^VERSION =.*/VERSION = $(echo ${{ inputs.kernel_version }} | cut -d. -f1)/" Makefile
             sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $(echo ${{ inputs.kernel_version }} | cut -d. -f2)/" Makefile
             sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $(echo ${{ inputs.kernel_version }} | cut -d. -f3)/" Makefile
         fi
         
         find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "*.config" -o -name "*defconfig" \) -exec sed -i 's/-mllvm -polly[-a-zA-Z0-9_=]*//g' {} + || true
         find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "*.config" -o -name "*defconfig" \) -exec sed -i 's/-polly[-a-zA-Z0-9_=]*//g' {} + || true
         
         TARGET_CONFIG="arch/arm64/configs/${{ inputs.kernel-config }}"
         
         sed -i "s/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"\"/g" $TARGET_CONFIG || true
         sed -i "s/CONFIG_LOCALVERSION_AUTO=.*/CONFIG_LOCALVERSION_AUTO=y/g" $TARGET_CONFIG || true
         echo "CONFIG_LOCALVERSION_AUTO=y" >> $TARGET_CONFIG
         rm -f .scmversion out/.scmversion
         
         if [ -f scripts/setlocalversion ]; then
             sed -i 's/scm_version_string=""/scm_version_string="-dirty"/g' scripts/setlocalversion || true
         fi
         
         echo "CONFIG_AUDIO_ELLIPTIC=n" >> $TARGET_CONFIG
         echo "CONFIG_EFI=n" >> $TARGET_CONFIG
         echo "CONFIG_EFI_STUB=n" >> $TARGET_CONFIG
         echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $TARGET_CONFIG
         echo "CONFIG_LKDTM=n" >> $TARGET_CONFIG
         
         echo "CONFIG_ANDROID_BINDERFS=y" >> $TARGET_CONFIG
         echo "CONFIG_CGROUPS=y" >> $TARGET_CONFIG
         echo "CONFIG_CGROUP_BPF=y" >> $TARGET_CONFIG
         echo "CONFIG_MEMCG=y" >> $TARGET_CONFIG
         echo "CONFIG_MEMCG_SWAP=y" >> $TARGET_CONFIG
         
         # --- Konfigurasi LTO ---
         sed -i 's/CONFIG_LTO=.*/# CONFIG_LTO is not set/g' $TARGET_CONFIG || true
         sed -i 's/CONFIG_LTO_CLANG_FULL=.*/# CONFIG_LTO_CLANG_FULL is not set/g' $TARGET_CONFIG || true
         sed -i 's/CONFIG_LTO_CLANG_THIN=.*/# CONFIG_LTO_CLANG_THIN is not set/g' $TARGET_CONFIG || true
         sed -i 's/CONFIG_LTO_CLANG=.*/# CONFIG_LTO_CLANG is not set/g' $TARGET_CONFIG || true
         sed -i 's/CONFIG_THINLTO=.*/# CONFIG_THINLTO is not set/g' $TARGET_CONFIG || true
         sed -i 's/CONFIG_LTO_NONE=.*/# CONFIG_LTO_NONE is not set/g' $TARGET_CONFIG || true
         if [ "${{ inputs.lto_mode }}" = "full" ]; then
             echo "CONFIG_LTO=y" >> $TARGET_CONFIG
             echo "CONFIG_LTO_CLANG=y" >> $TARGET_CONFIG
             echo "CONFIG_LTO_CLANG_FULL=y" >> $TARGET_CONFIG
         elif [ "${{ inputs.lto_mode }}" = "thin" ]; then
             echo "CONFIG_LTO=y" >> $TARGET_CONFIG
             echo "CONFIG_LTO_CLANG=y" >> $TARGET_CONFIG
             echo "CONFIG_THINLTO=y" >> $TARGET_CONFIG
             echo "CONFIG_LTO_CLANG_THIN=y" >> $TARGET_CONFIG
         else
             echo "CONFIG_LTO_NONE=y" >> $TARGET_CONFIG
         fi
         # -----------------------
         
         # --- URUTAN MUTLAK LOGIKA ROOT: PATCH MANUAL HUK DULU BARU KSUNEXT ---
         if [ "${{ inputs.kernelsu }}" != "false" ]; then
             # Langkah 1: Eksekusi Patch Manual Hook Terlebih Dahulu
             wget https://raw.githubusercontent.com/rksuorg/kernel_patches/refs/heads/master/manual_hook/kernel-4.4_4.9.patch
             patch -p1 < kernel-4.4_4.9.patch || echo "Patch manual hook terlewat atau gagal diterapkan"
             
             # Langkah 2: Jalankan Setup Script KSU-Next Sesuai Pilihan Versi
             if [ "${{ inputs.kernelsu }}" = "next-v3.0.0" ]; then
                 curl https://raw.githubusercontent.com/ThRE-Team/Next-v3/refs/heads/main/setup.sh | bash
             elif [ "${{ inputs.kernelsu }}" = "next-v3.1.0" ]; then
                 curl -LSs https://raw.githubusercontent.com/ThRE-Team/KernelSU-Next/main/kernel/setup.sh | bash -s main
             elif [ "${{ inputs.kernelsu }}" = "next-v3.2.0" ]; then
                 curl -LSs https://raw.githubusercontent.com/ThRE-Team/KernelSU-Next/main/kernel/setup.sh | bash -s v3.2.0
             fi
             
             # Langkah 3: Tambahkan Konfigurasi Defconfig (DILARANG AKTIFKAN CONFIG_KPROBES)
             echo "CONFIG_KSU=y" >> $TARGET_CONFIG
             echo "CONFIG_KSU_MANUAL_HOOK=y" >> $TARGET_CONFIG
             echo "CONFIG_OVERLAY_FS=y" >> $TARGET_CONFIG
             
             sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g' $TARGET_CONFIG || true
             sed -i 's/CONFIG_HAVE_KPROBES=y/# CONFIG_HAVE_KPROBES is not set/g' $TARGET_CONFIG || true
             echo "# CONFIG_KPROBES is not set" >> $TARGET_CONFIG
         else
             # Setelan Full Support APatch (KSU Disabled, Bersih Tanpa Patch Manual Hook)
             echo "CONFIG_KALLSYMS=y" >> $TARGET_CONFIG
             echo "CONFIG_KALLSYMS_ALL=y" >> $TARGET_CONFIG
             echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> $TARGET_CONFIG
             echo "CONFIG_KPROBES=y" >> $TARGET_CONFIG
             echo "CONFIG_HAVE_KPROBES=y" >> $TARGET_CONFIG
         fi
         # ---------------------------------------------------------------------
         
    - name: Proses Kompilasi Kernel
      run: |
         cd kernel-dir
         export PATH=$HOME/tc/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH
         export KBUILD_BUILD_USER="${{ inputs.project_name }}"
         export KBUILD_BUILD_HOST="project_labs"
         
         rm -rf ../out && mkdir -p ../out
         make ARCH=arm64 O=../out ${{ inputs.kernel-config }}
         
         TOTAL_CORES=$(nproc --all)
         SAFE_CORES=$((TOTAL_CORES > 1 ? TOTAL_CORES - 1 : 1))
         CLEAN_ROM_TYPE=$(echo "${{ inputs.rom_type }}" | tr -d ' ')
         
         make -j$SAFE_CORES ARCH=arm64 O=../out \
              CC=clang \
              LD=ld.lld \
              HOSTLD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              GCC_TOOLCHAIN=$HOME/gcc-64 \
              LOCALVERSION="-${{ inputs.kernel_name }}-${CLEAN_ROM_TYPE}" \
              KCFLAGS="-w -Wno-error -fno-builtin" \
              HOSTCFLAGS="-w -Wno-error" Image.gz Image.gz-dtb dtbs 2>&1 | tee build.log
         
         if [ ! -f ../out/arch/arm64/boot/Image ] && [ ! -f ../out/arch/arm64/boot/Image.gz ] && [ ! -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "ERROR: Kompilasi Gagal!"
             tail -n 150 build.log
             exit 1
         fi
         
    - name: Kumpulkan Mentahan Biner Kernel
      run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_binaries
          
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
              cp out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/kernel_binaries/Image.gz-dtb
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
              DTB_PATH="out/arch/arm64/boot/dts/qcom/sdm845-beryllium.dtb"
              if [ -f "$DTB_PATH" ]; then
                  cat out/arch/arm64/boot/Image.gz $DTB_PATH > $GITHUB_WORKSPACE/kernel_binaries/Image.gz-dtb
              else
                  cp out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/kernel_binaries/Image.gz
              fi
          fi
          
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
              cp out/arch/arm64/boot/dtbo.img $GITHUB_WORKSPACE/kernel_binaries/dtbo.img
          fi
    - name: Upload Biner Mentah Kernel
      uses: actions/upload-artifact@v4
      with:
        name: "${{ inputs.zip_name }}-${{ inputs.rom_type }}-Binaries"
        path: kernel_binaries/**
