# Kyzuna Project - Customized for Poco F1 (beryllium)
name: Build ala env
run-name: 🚀 ${{ inputs.zip_name }} | ${{ inputs.kernel-config }} | ${{ inputs.kernel_name }} | ${{ inputs.rom_type }} | ${{ inputs.compiler }} | ${{ inputs.lto_mode }} | ${{ inputs.kernel-branch }} | ${{ inputs.kernelsu }}

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip Output Name'
        required: true
        type: string
      ubuntu:
        description: 'Ubuntu Version'
        default: 'ubuntu-24.04'
        required: true
        type: string
      kernel_name:
        description: 'Kernel Name'
        required: true
        type: string
      rom_type:
        description: 'ROM Type (cth: AOSP / MIUI)'
        required: true
        type: string
      project_name:
        description: 'Project Name'
        default: 'selea×kyy'
        required: true
        type: string
      compiler:
        description: 'Compiler Choice'
        default: 'aosp-clang'
        required: true
        type: choice
        options:
          - zyc-clang
          - yuki-clang
          - weebx-clang
          - neutron-clang
          - aosp-clang
          - debian-clang
      lto_mode:
        description: 'LTO Optimization'
        default: 'none'
        required: true
        type: choice
        options:
          - 'no lto'
          - full
          - thin
      merge_config:
        description: 'Merge Config (vendor/xiaomi) / Single Config (arch/configs)'
        default: false
        type: boolean
      kernel-config:
        description: 'Nama config (cth: defconfig atau mi_defconfig, .config)'
        default: 'defconfig'
        required: true
        type: string
      custom_tweaks:
        description: '1. Tweak .sh/.patch (Pre-KSU). Kosong = none'
        default: 'none'
        required: false
        type: string
      kernelsu:
        description: '2 & 3. Pilih Root Method / Fork KSU'
        default: 'none'
        required: true
        type: choice
        options:
          - "none"
          - "apatch"
          - "xxksu"
          - "mambosu"
          - "rsuntk"
          - "sukisu"
          - "next"
          - "resukisu"
          - "thre"
      custom_hooks:
        description: '4. Hook Script .sh/.patch (Post-KSU). Kosong = none'
        default: 'none'
        required: false
        type: string
      susfs_enable:
        description: '5 & 6. Enable SuSFS & Config'
        default: false
        type: boolean
      susfs_custom:
        description: '7. SuSFS Script/Patch khusus (.sh/.patch). Kosong = none'
        default: 'none'
        required: false
        type: string
      extra_config:
        description: '8. Ekstra Config manual (cth: debug_fs, -preempt). Kosong = none'
        required: false
        type: string
        default: 'none'
      version_hash:
        description: 'Include Version Hash'
        default: 'no hash'
        required: true
        type: choice
        options:
          - 'no hash'
          - hash
      kernel-url:
        description: 'Kernel Source URL'
        default: 'https://github.com/kyzuna28/bka.git'
        required: true
        type: string
      kernel-branch:
        description: 'Kernel Source Branch'
        default: 'nse'
        required: true
        type: string
      anykernel-url:
        description: 'AnyKernel3 Repository URL'
        default: 'https://github.com/kyzuna28/AnyKernel3.git'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.ubuntu }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REPO_RAW: "https://raw.githubusercontent.com/kyzuna28/Compiler/main"
      REPO_API: "https://api.github.com/repos/kyzuna28/Compiler/git/trees/main?recursive=1"

    steps:
      - name: 🧹 Clean Environment & Install Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu lld llvm g++-aarch64-linux-gnu bc aria2 zip tar libssl-dev flex bison git git-lfs libelf-dev python3 libdata-dump-perl libtinfo-dev libncurses5-dev zstd libncurses6 curl wget patch lsb-release software-properties-common gnupg
          
          [[ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]] && sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || sudo apt-get install --no-install-recommends -y libtinfo5

      - name: 💽 Setup Dynamic Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          SWAP_SIZE=$([[ "${{ inputs.lto_mode }}" == "full" ]] && echo "16G" || echo "8G")
          
          sudo fallocate -l $SWAP_SIZE /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: 🛠️ Download Toolchain
        run: |
          mkdir -p $HOME/tc
          cd $HOME
          
          case "${{ inputs.compiler }}" in
            zyc-clang) git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git -b 21 tc ;;
            yuki-clang) git clone --depth=1 https://gitlab.com/TheXPerienceProject/yuki_clang.git -b 18.0.0 tc ;;
            weebx-clang) curl -sL https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz | tar -xz -C tc ;;
            neutron-clang) cd tc && curl -sLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" && chmod +x antman && ./antman -S=10032024 ;;
            aosp-clang) git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git -b 15.0 tc ;;
            debian-clang)
              wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 21
              sudo apt-get install --no-install-recommends -y clang-21 lld-21 llvm-21
              mkdir -p tc/bin
              echo -e '#!/bin/bash\nif [[ "$1" == "--version" || "$1" == "-v" ]]; then echo -e "Debian clang version 21.1.8\nTarget: aarch64-unknown-linux-gnu"; exit 0; fi\nexec /usr/bin/clang-21 "$@"' > tc/bin/clang
              echo -e '#!/bin/bash\nif [[ "$1" == "--version" || "$1" == "-v" ]]; then echo "Debian LLD 21.1.8"; exit 0; fi\nexec /usr/bin/ld.lld-21 "$@"' > tc/bin/ld.lld
              chmod +x tc/bin/*
              for tool in ar nm objcopy objdump; do ln -sf /usr/bin/llvm-$tool-21 tc/bin/llvm-$tool; done
              ;;
          esac

      - name: 📂 Clone Kernel Source
        run: |
          git clone --depth=1 ${{ inputs.kernel-url }} -b ${{ inputs.kernel-branch }} kernel-dir
          cd kernel-dir && git submodule update --init --recursive || true

      - name: 🔀 Alur Merge / Single Config
        run: |
          cd kernel-dir
          export PATH=$HOME/tc/bin:$PATH
          
          CONFIG_INPUT="${{ inputs.kernel-config }}"
          IS_MERGE="${{ inputs.merge_config }}"
          BASE_DIR="arch/arm64/configs"

          if [[ "$IS_MERGE" == "true" ]]; then
              IFS=',' read -ra CONF_FILES <<< "$CONFIG_INPUT"
              for i in "${!CONF_FILES[@]}"; do CONF_FILES[$i]=$(echo "${CONF_FILES[$i]}" | xargs); done

              BASE_CONF="${CONF_FILES[0]}"
              MAKE_DEFCONFIG="vendor/xiaomi/$BASE_CONF"
              TARGET_CONFIG="$BASE_DIR/$MAKE_DEFCONFIG"
              
              for (( i=1; i<${#CONF_FILES[@]}; i++ )); do
                  FRAG="${CONF_FILES[$i]}"
                  TARGET_FRAG="$BASE_DIR/vendor/xiaomi/$FRAG"
                  if [ -f "$TARGET_FRAG" ]; then echo -e "\n$(cat $TARGET_FRAG)" >> "$TARGET_CONFIG"; fi
              done
          else
              CLEAN_CONF=$(echo "$CONFIG_INPUT" | xargs)
              MAKE_DEFCONFIG="$CLEAN_CONF"
              TARGET_CONFIG="$BASE_DIR/$MAKE_DEFCONFIG"
          fi

          echo "MAKE_DEFCONFIG=$MAKE_DEFCONFIG" >> $GITHUB_ENV
          echo "TARGET_CONFIG=$TARGET_CONFIG" >> $GITHUB_ENV

          sed -i 's/^EXTRAVERSION.*/EXTRAVERSION =/g' Makefile
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/g' "$TARGET_CONFIG" || true
          
          COMPILER_NAME=$(echo "${{ inputs.compiler }}" | awk -F'-' '{print toupper(substr($1,1,1)) substr($1,2) " Clang"}')
          RAW_CLANG_VER=$(clang --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || echo "Custom")
          RAW_LLD_VER=$(ld.lld --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || echo "$RAW_CLANG_VER")
          CUSTOM_COMPILER_STRING="${COMPILER_NAME:-Debian Clang} ${RAW_CLANG_VER} ✦ Pipeline: pgo • autofdo • bolt • propeller • thinlto • mlgo • polly • -o3 ✦ LLD ${RAW_LLD_VER}"
          
          echo "CUSTOM_COMPILER_STRING=$CUSTOM_COMPILER_STRING" >> $GITHUB_ENV
          sed -i 's|.*LINUX_COMPILER.*|echo \\#define LINUX_COMPILER \\"'"$CUSTOM_COMPILER_STRING"'\\"|g' scripts/mkcompile_h || true

      - name: 🧩 Alur Tweak .sh / .patch (Pre-KSU)
        run: |
          cd kernel-dir
          input_string="${{ inputs.custom_tweaks }}"
          if [[ "$input_string" != "none" && -n "$input_string" ]]; then
              export REPO_TREE_CACHE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$REPO_API" | grep -o '"path": "[^"]*"' | cut -d'"' -f4)
              IFS=',' read -ra FILES <<< "$input_string"
              for file in "${FILES[@]}"; do
                  file=$(echo "$file" | xargs); [[ -z "$file" ]] && continue
                  FILE_PATH=$(echo "$REPO_TREE_CACHE" | grep -E "(^|/)$file$" | head -n 1)
                  if [[ -n "$FILE_PATH" ]]; then
                      echo "✅ Eksekusi Tweak: $file..."
                      wget -q "$REPO_RAW/$FILE_PATH" -O "$file"
                      if [[ "$file" == *.patch ]]; then patch -p1 < "$file" || exit 1
                      elif [[ "$file" == *.sh ]]; then chmod +x "$file" && bash "$file" || exit 1
                      fi
                  else
                      echo "❌ [ERROR] Tweak $file tidak ditemukan!" && exit 1
                  fi
              done
          fi

      - name: 👑 Alur Config KSU & Install KSU
        run: |
          cd kernel-dir
          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          KSU_CHOICE="${{ inputs.kernelsu }}"
          
          enable_cfg() { for cfg in "$@"; do echo "CONFIG_$cfg=y" >> "$TARGET_CONFIG"; done; }
          disable_cfg() { for cfg in "$@"; do sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" "$TARGET_CONFIG" || true; echo "# CONFIG_$cfg is not set" >> "$TARGET_CONFIG"; done; }

          # CONFIG KSU
          if [ "$KSU_CHOICE" != "none" ] && [ "$KSU_CHOICE" != "apatch" ]; then
            enable_cfg KSU
            if [[ "$KSU_CHOICE" == "xxksu" || "$KSU_CHOICE" == "mambosu" ]]; then disable_cfg KSU_KPROBES_KSUD; fi
            if [[ "$KSU_CHOICE" == "thre" ]]; then enable_cfg KSU_MANUAL_HOOK; disable_cfg KPROBES HAVE_KPROBES; fi
            if [[ "$KSU_CHOICE" == "rsuntk" || "$KSU_CHOICE" == "next" || "$KSU_CHOICE" == "resukisu" ]]; then
              [[ "${{ inputs.susfs_enable }}" != "true" ]] && enable_cfg KSU_MANUAL_HOOK
            fi
            
            # INSTALL KSU
            case "$KSU_CHOICE" in
              xxksu) URL="https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" && B_NAME="master" ;;
              mambosu) URL="https://raw.githubusercontent.com/RapliVx/KernelSU/master/kernel/setup.sh" && B_NAME="xxksu" ;;
              rsuntk) URL="https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" && B_NAME="main" ;;
              sukisu) URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" && B_NAME="builtin" ;;
              next) URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" && B_NAME="legacy" ;;
              resukisu) URL="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" && B_NAME="main" ;;
              thre) URL="https://raw.githubusercontent.com/ThRE-Team/KernelSU-Next/main/kernel/setup.sh" && B_NAME="main" ;;
            esac
            echo "📥 Menginstall KernelSU ($KSU_CHOICE)..."
            curl -fsSL "$URL" | bash -s "$B_NAME" || exit 1

          elif [ "$KSU_CHOICE" == "apatch" ]; then
            enable_cfg KALLSYMS KALLSYMS_ALL KALLSYMS_BASE_RELATIVE KPROBES HAVE_KPROBES
          fi

      - name: 🪝 Alur Hook Script .sh / .patch (Post-KSU)
        run: |
          cd kernel-dir
          input_string="${{ inputs.custom_hooks }}"
          if [[ "$input_string" != "none" && -n "$input_string" ]]; then
              export REPO_TREE_CACHE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$REPO_API" | grep -o '"path": "[^"]*"' | cut -d'"' -f4)
              IFS=',' read -ra FILES <<< "$input_string"
              for file in "${FILES[@]}"; do
                  file=$(echo "$file" | xargs); [[ -z "$file" ]] && continue
                  FILE_PATH=$(echo "$REPO_TREE_CACHE" | grep -E "(^|/)$file$" | head -n 1)
                  if [[ -n "$FILE_PATH" ]]; then
                      echo "✅ Eksekusi Hook: $file..."
                      wget -q "$REPO_RAW/$FILE_PATH" -O "$file"
                      if [[ "$file" == *.patch ]]; then patch -p1 < "$file" || exit 1
                      elif [[ "$file" == *.sh ]]; then chmod +x "$file" && bash "$file" || exit 1
                      fi
                  else
                      echo "❌ [ERROR] Hook $file tidak ditemukan!" && exit 1
                  fi
              done
          fi

      - name: 🛡️ Alur SuSFS Config & Enable
        run: |
          cd kernel-dir
          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          SUSFS_ENABLE="${{ inputs.susfs_enable }}"
          KSU_CHOICE="${{ inputs.kernelsu }}"
          
          enable_cfg() { for cfg in "$@"; do echo "CONFIG_$cfg=y" >> "$TARGET_CONFIG"; done; }
          disable_cfg() { for cfg in "$@"; do sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" "$TARGET_CONFIG" || true; echo "# CONFIG_$cfg is not set" >> "$TARGET_CONFIG"; done; }

          if [[ "$SUSFS_ENABLE" == "true" ]]; then
            echo "🛡️ Mengaktifkan Konfigurasi SuSFS..."
            enable_cfg KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP
            
            if [ -f "drivers/kernelsu/Kconfig" ] && grep -q "THREAD_INFO_IN_TASK" "drivers/kernelsu/Kconfig"; then 
              enable_cfg THREAD_INFO_IN_TASK
            fi
          else
            if [[ "$KSU_CHOICE" == "sukisu" || "$KSU_CHOICE" == "resukisu" ]]; then
              disable_cfg KSU_SUSFS
            fi
          fi

      - name: 💉 Alur SuSFS Script / Patch (Khusus SuSFS)
        run: |
          cd kernel-dir
          input_string="${{ inputs.susfs_custom }}"
          if [[ "$input_string" != "none" && -n "$input_string" ]]; then
              export REPO_TREE_CACHE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$REPO_API" | grep -o '"path": "[^"]*"' | cut -d'"' -f4)
              IFS=',' read -ra FILES <<< "$input_string"
              for file in "${FILES[@]}"; do
                  file=$(echo "$file" | xargs); [[ -z "$file" ]] && continue
                  FILE_PATH=$(echo "$REPO_TREE_CACHE" | grep -E "(^|/)$file$" | head -n 1)
                  if [[ -n "$FILE_PATH" ]]; then
                      echo "✅ Eksekusi SuSFS Script: $file..."
                      wget -q "$REPO_RAW/$FILE_PATH" -O "$file"
                      if [[ "$file" == *.patch ]]; then patch -p1 < "$file" || exit 1
                      elif [[ "$file" == *.sh ]]; then chmod +x "$file" && bash "$file" || exit 1
                      fi
                  else
                      echo "❌ [ERROR] SuSFS Script $file tidak ditemukan!" && exit 1
                  fi
              done
          fi

      - name: 🚀 Alur Setup LTO Optimization
        run: |
          cd kernel-dir
          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          
          enable_cfg() { for cfg in "$@"; do echo "CONFIG_$cfg=y" >> "$TARGET_CONFIG"; done; }
          disable_cfg() { for cfg in "$@"; do sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" "$TARGET_CONFIG" || true; echo "# CONFIG_$cfg is not set" >> "$TARGET_CONFIG"; done; }

          disable_cfg LTO LTO_CLANG_FULL LTO_CLANG_THIN LTO_CLANG THINLTO LTO_NONE
          case "${{ inputs.lto_mode }}" in
            full) enable_cfg LTO LTO_CLANG LTO_CLANG_FULL ;;
            thin) enable_cfg LTO LTO_CLANG THINLTO LTO_CLANG_THIN ;;
            *) enable_cfg LTO_NONE ;;
          esac

      - name: 🛠️ Alur Ekstra Config Manual (Paling Akhir)
        run: |
          cd kernel-dir
          TARGET_CONFIG="${{ env.TARGET_CONFIG }}"
          
          enable_cfg() { for cfg in "$@"; do echo "CONFIG_$cfg=y" >> "$TARGET_CONFIG"; done; }
          disable_cfg() { for cfg in "$@"; do sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" "$TARGET_CONFIG" || true; echo "# CONFIG_$cfg is not set" >> "$TARGET_CONFIG"; done; }

          EXTRA_CONFIG="${{ inputs.extra_config }}"
          if [[ "$EXTRA_CONFIG" != "none" && -n "$EXTRA_CONFIG" ]]; then
              IFS=',' read -ra CONFIGS <<< "$EXTRA_CONFIG"
              for CFG in "${CONFIGS[@]}"; do
                  # Bersihkan spasi dan ubah ke huruf kapital
                  CFG=$(echo "$CFG" | xargs | tr '[:lower:]' '[:upper:]')
                  [[ -z "$CFG" ]] && continue
                  
                  # Buang prefix CONFIG_ jika user terlanjur menulisnya
                  if [[ "$CFG" == -CONFIG_* ]]; then CFG="-${CFG#-CONFIG_}"; elif [[ "$CFG" == CONFIG_* ]]; then CFG="${CFG#CONFIG_}"; fi
                  
                  # Deteksi Tanda Minus (-) untuk Disable
                  if [[ "$CFG" == -* ]]; then
                      CLEAN_CFG="${CFG#-}"
                      echo "❌ Menonaktifkan: CONFIG_$CLEAN_CFG" && disable_cfg "$CLEAN_CFG"
                  # Deteksi =N untuk Disable
                  elif [[ "$CFG" == *=N ]]; then
                      CLEAN_CFG="${CFG%=N}"
                      echo "❌ Menonaktifkan: CONFIG_$CLEAN_CFG" && disable_cfg "$CLEAN_CFG"
                  # Deteksi =Y untuk Enable
                  elif [[ "$CFG" == *=Y ]]; then
                      CLEAN_CFG="${CFG%=Y}"
                      echo "✅ Mengaktifkan: CONFIG_$CLEAN_CFG" && enable_cfg "$CLEAN_CFG"
                  # Default Enable (misal input: debug_fs)
                  else
                      echo "✅ Mengaktifkan: CONFIG_$CFG" && enable_cfg "$CFG"
                  fi
              done
          fi

      - name: 🔨 Alur Compile Kernel
        run: |
          cd kernel-dir
          export PATH=$HOME/tc/bin:$PATH
          export KBUILD_BUILD_USER="${{ inputs.project_name }}"
          export KBUILD_BUILD_HOST="project"
          export KBUILD_COMPILER_STRING="$CUSTOM_COMPILER_STRING"
          export LLVM_PARALLEL=1

          [[ "${{ inputs.version_hash }}" == "no hash" ]] && echo "" > .scmversion && export LOCALVERSION_AUTO="" || rm -f .scmversion

          rm -rf ../out && mkdir -p ../out
          
          BASENAME_CONFIG=$(basename "${{ env.MAKE_DEFCONFIG }}")
          if [ ! -f "arch/arm64/configs/$BASENAME_CONFIG" ]; then cp "${{ env.TARGET_CONFIG }}" "arch/arm64/configs/$BASENAME_CONFIG"; fi
          
          make ARCH=arm64 O=../out "$BASENAME_CONFIG" || exit 1

          EXTRA_CFLAGS=$([[ "${{ inputs.compiler }}" == "debian-clang" ]] && echo "--target=aarch64-linux-gnu" || echo "")
          OPTIMIZATION_FLAGS="-O3 -mcpu=cortex-a75 -mtune=cortex-a75 -falign-functions=64"
          
          CORES=$(nproc --all)
          MAKE_JOBS=$(( (CORES + 1) / 2 ))
          [[ "${{ inputs.lto_mode }}" == "full" ]] && MAKE_JOBS=2
          [[ "$MAKE_JOBS" -lt 2 ]] && MAKE_JOBS=2
          [[ "$MAKE_JOBS" -gt 8 ]] && MAKE_JOBS=8

          CLEAN_ROM=$(echo "${{ inputs.rom_type }}" | tr -d ' ')
          CLEAN_KERNEL=$(echo "${{ inputs.kernel_name }}" | tr -d ' ')

          echo "🚀 CPU Cores: $CORES | Used Jobs: $MAKE_JOBS"
          
          make -j$MAKE_JOBS ARCH=arm64 O=../out \
            LLVM=1 LLVM_IAS=1 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            LD=ld.lld HOSTLD=ld.lld \
            AR=llvm-ar HOSTAR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="-${CLEAN_KERNEL}-${CLEAN_ROM}" \
            KCFLAGS="$OPTIMIZATION_FLAGS -w -Qunused-arguments -Wno-error -fno-builtin -fomit-frame-pointer $EXTRA_CFLAGS" \
            Image.gz Image.gz-dtb dtbs
          
          if [ ! -s "../out/arch/arm64/boot/Image.gz" ] && [ ! -s "../out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ [ERROR] Kompilasi gagal." && exit 1
          else
            echo "✅ [SUCCESS] Kompilasi berhasil."
          fi
          
      - name: Package with AnyKernel3
        run: |
          echo "📥 [FETCH] Mengkloning repositori AnyKernel3..."
          git clone --depth=1 ${{ inputs.anykernel-url }} AnyKernel3
          rm -rf AnyKernel3/{.git,.github,LICENSE,README.md,modules,patch,ramdisk,*.txt,*.md}

          KERNEL_DIR="out/arch/arm64/boot"
          
          echo "⚙️ [PROSES] Menyiapkan file kernel..."
          if [[ -f "$KERNEL_DIR/Image.gz" && -f "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" ]]; then
            echo "📦 [BUILD] Menggabungkan Image.gz dengan Beryllium DTB..."
            cat "$KERNEL_DIR/Image.gz" "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" > AnyKernel3/Image.gz-dtb
          else
            COMPRESSED_FOUND="false"
            for img in Image.gz-dtb Image-dtb Image.gz; do
              if [[ -f "$KERNEL_DIR/$img" ]]; then 
                echo "✅ [INFO] Ditemukan file $img, menyalin ke AnyKernel3..."
                cp "$KERNEL_DIR/$img" AnyKernel3/
                COMPRESSED_FOUND="true"
                break
              fi
            done
            
            if [[ "$COMPRESSED_FOUND" != "true" && -f "$KERNEL_DIR/Image" ]]; then
              echo "⚠️ [WARN] Image terkompresi tidak ditemukan!"
              echo "🗜️ [COMPRESS] Mengompres Image mentah ke Gzip secara manual (-9)..."
              gzip -n -9 < "$KERNEL_DIR/Image" > AnyKernel3/Image.gz
            fi
          fi

          if [[ -f "$KERNEL_DIR/dtbo.img" ]]; then
            echo "💾 [INFO] Ditemukan dtbo.img, menyalin ke AnyKernel3..."
            cp "$KERNEL_DIR/dtbo.img" AnyKernel3/
          fi
          
          rm -f AnyKernel3/*placeholder

          # --- Pengecekan Akhir (Status Berhasil / Gagal) ---
          echo "🔍 [CEK] Memverifikasi hasil packaging AnyKernel3..."
          if ls AnyKernel3/Image* 1> /dev/null 2>&1; then
            echo "✨ [SUKSES] File kernel berhasil dipaketkan ke dalam folder AnyKernel3!"
            echo "🎉 [SELESAI] Siap untuk proses Upload."
          else
            echo "❌ [GAGAL] File Image kernel tidak ditemukan di folder AnyKernel3!"
            echo "💀 [FATAL] Terjadi kesalahan saat memindahkan kernel build. Membatalkan proses..."
            exit 1
          fi

          echo "🏷️ [TAG] Menyiapkan nama output Artifact..."
          CLEAN_ZIP_NAME=$(echo "${{ inputs.zip_name }}" | tr ' ' '_')
          echo "FINAL_ARTIFACT_NAME=$CLEAN_ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.FINAL_ARTIFACT_NAME }}"
          path: AnyKernel3/
          compression-level: 9
          if-no-files-found: error
        