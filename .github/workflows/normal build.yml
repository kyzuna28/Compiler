# Kyzuna Project - Customized for Poco F1 (beryllium)
name: Tes merge
run-name: 🚀 ${{ inputs.zip_name }} | ${{ inputs.kernel-config }} | ${{ inputs.kernelsu }} | ${{ inputs.lto_mode }} | ${{ inputs.compiler }}

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip Output Name (Cth: Kyzuna-Kernel-v1)'
        required: true
        type: string
      kernel_name:
        description: 'Kernel Name (Localversion)'
        required: true
        type: string
      rom_type:
        description: 'ROM Type (Cth: MIUI, AOSP)'
        required: true
        type: string
      project_name:
        description: 'Project Name (Build User)'
        default: 'selea×kyy'
        required: true
        type: string
      kernel-url:
        description: 'Kernel Source URL'
        default: 'https://github.com/kyzuna28/kyy.git'
        required: true
        type: string
      kernel-branch:
        description: 'Kernel Source Branch'
        default: 'nse'
        required: true
        type: string
      anykernel-url:
        description: 'AnyKernel3 Repository URL'
        default: 'https://github.com/kyzuna28/AnyKernel3.git'
        required: true
        type: string
      merge_config:
        description: 'Merge Config (vendor/xiaomi) [Centang] / Single Config (arch/configs) [Hilangkan Centang]'
        default: true
        type: boolean
      kernel-config:
        description: 'Nama config (cth: beryllium_defconfig atau mi_defconfig, .config)'
        default: 'beryllium_defconfig'
        required: true
        type: string
      custom_tweaks:
        description: '2. Tweak .sh / .patch (Pre-KSU). Kosongkan isi dengan: none'
        default: 'none'
        required: false
        type: string
      kernelsu:
        description: '3 & 4. Pilih Root Method (KSU Config & Install)'
        default: 'none'
        required: true
        type: choice
        options:
          - "none"
          - "apatch"
          - "xxksu"
          - "mambosu"
          - "rsuntk"
          - "sukisu"
          - "next"
          - "resukisu"
          - "thre"
      custom_hooks:
        description: '5. Hook script .sh / .patch (Post-KSU). Kosongkan isi dengan: none'
        default: 'none'
        required: false
        type: string
      susfs_enable:
        description: '6 & 7. Enable & Config SuSFs (Khusus fork KSU yang mendukung)'
        default: false
        required: true
        type: boolean
      susfs_scripts:
        description: '8. SuSFs Custom Script / .patch. Kosongkan isi dengan: none'
        default: 'none'
        required: false
        type: string
      lto_mode:
        description: 'LTO Optimization (Opsi Mandiri terpisah dari Extra Config)'
        default: 'no lto'
        required: true
        type: choice
        options:
          - no lto
          - full
          - thin
      extra_config:
        description: '9. Extra Config Override Final. (+) nama config, (-) untuk disable. Cth: debug_fs, -kprobes. Kosong = none'
        default: 'none'
        required: false
        type: string
      compiler:
        description: 'Compiler Choice'
        default: 'aosp-clang'
        required: true
        type: choice
        options:
          - zyc-clang
          - yuki-clang
          - weebx-clang
          - neutron-clang
          - aosp-clang
          - debian-clang
      version_hash:
        description: 'Include Version Hash'
        default: 'no hash'
        required: true
        type: choice
        options:
          - no hash
          - hash
      ubuntu:
        description: 'Ubuntu Version'
        default: 'ubuntu-24.04'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.ubuntu }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Clean Environment & Install Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu lld llvm g++-aarch64-linux-gnu bc aria2 zip tar libssl-dev flex bison git git-lfs libelf-dev python3 libdata-dump-perl libtinfo-dev libncurses5-dev zstd libncurses6 curl wget patch lsb-release software-properties-common gnupg
          
          [[ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]] && sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || sudo apt-get install --no-install-recommends -y libtinfo5

      - name: Setup Dynamic Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          SWAP_SIZE=$([[ "${{ inputs.lto_mode }}" == "full" ]] && echo "16G" || echo "8G")
          
          sudo fallocate -l $SWAP_SIZE /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Download Toolchain
        run: |
          mkdir -p $HOME/tc
          cd $HOME
          
          case "${{ inputs.compiler }}" in
            zyc-clang) git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git -b 21 tc ;;
            yuki-clang) git clone --depth=1 https://gitlab.com/TheXPerienceProject/yuki_clang.git -b 18.0.0 tc ;;
            weebx-clang) curl -sL https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz | tar -xz -C tc ;;
            neutron-clang) cd tc && curl -sLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" && chmod +x antman && ./antman -S=10032024 ;;
            aosp-clang) git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git -b 15.0 tc ;;
            debian-clang)
              wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 21
              sudo apt-get install --no-install-recommends -y clang-21 lld-21 llvm-21
              mkdir -p tc/bin
              echo -e '#!/bin/bash\nif [[ "$1" == "--version" || "$1" == "-v" ]]; then echo -e "Debian clang version 21.1.8\nTarget: aarch64-unknown-linux-gnu"; exit 0; fi\nexec /usr/bin/clang-21 "$@"' > tc/bin/clang
              echo -e '#!/bin/bash\nif [[ "$1" == "--version" || "$1" == "-v" ]]; then echo "Debian LLD 21.1.8"; exit 0; fi\nexec /usr/bin/ld.lld-21 "$@"' > tc/bin/ld.lld
              chmod +x tc/bin/*
              for tool in ar nm objcopy objdump; do ln -sf /usr/bin/llvm-$tool-21 tc/bin/llvm-$tool; done
              ;;
          esac

      - name: Clone Kernel Source & Init Submodules
        run: |
          git clone --depth=1 ${{ inputs.kernel-url }} -b ${{ inputs.kernel-branch }} kernel-dir
          cd kernel-dir
          git submodule update --init --recursive

      - name: Execution Flow (Config -> Tweak -> Root -> SuSFs -> LTO -> Extra)
        run: |
          cd kernel-dir
          export PATH=$HOME/tc/bin:$PATH
          
          # ==========================================
          # GLOBAL HELPER FUNCTIONS
          # ==========================================
          enable_cfg() { for cfg in "$@"; do echo "CONFIG_$cfg=y" >> "$TARGET_CONFIG"; done; }
          disable_cfg() { for cfg in "$@"; do sed -i "s/CONFIG_$cfg=.*/# CONFIG_$cfg is not set/g" "$TARGET_CONFIG" || true; echo "# CONFIG_$cfg is not set" >> "$TARGET_CONFIG"; done; }
          
          REPO_RAW="https://raw.githubusercontent.com/kyzuna28/Compiler/main"
          REPO_API="https://api.github.com/repos/kyzuna28/Compiler/git/trees/main?recursive=1"
          export REPO_TREE_CACHE=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$REPO_API" | grep -o '"path": "[^"]*"' | cut -d'"' -f4)

          process_custom_files() {
              local input_string="$1"
              local step_name="$2"
              if [[ "$input_string" != "none" && -n "$input_string" ]]; then
                  echo "🪝 [$step_name] Memproses: $input_string..."
                  IFS=',' read -ra FILES <<< "$input_string"
                  for file in "${FILES[@]}"; do
                      file=$(echo "$file" | xargs)
                      [[ -z "$file" ]] && continue
                      
                      echo "⬇️ Mencari $file di repositori Compiler..."
                      FILE_PATH=$(echo "$REPO_TREE_CACHE" | grep -E "(^|/)$file$" | head -n 1)
                      
                      if [[ -n "$FILE_PATH" ]]; then
                          echo "✅ Ditemukan: $FILE_PATH"
                          wget -q "$REPO_RAW/$FILE_PATH" -O "$file"
                          
                          if [[ "$file" == *.patch ]]; then
                              echo "🩹 Menerapkan patch $file..."
                              patch -p1 < "$file" || { echo "❌ [FATAL] Gagal menerapkan patch $file! Proses berhenti."; exit 1; }
                          elif [[ "$file" == *.sh ]]; then
                              echo "🚀 Menjalankan script $file..."
                              chmod +x "$file"
                              bash "$file" || { echo "❌ [FATAL] Script $file gagal! Proses berhenti."; exit 1; }
                          else
                              echo "❌ [FATAL] Ekstensi $file tidak didukung! Gunakan .patch atau .sh."; exit 1;
                          fi
                      else
                          echo "❌ [FATAL] Gagal mengunduh $file! File tidak ditemukan di folder repositori."; exit 1;
                      fi
                  done
              fi
          }

          # ==========================================
          # 1. MERGE / SINGLE CONFIG
          # ==========================================
          echo -e "\n=== 1. MERGE / SINGLE CONFIG ==="
          CONFIG_INPUT="${{ inputs.kernel-config }}"
          IS_MERGE="${{ inputs.merge_config }}"
          BASE_DIR="arch/arm64/configs"

          if [[ "$IS_MERGE" == "true" ]]; then
              echo "⚙️ Mode Aktif: Merge Config (vendor/xiaomi/)"
              IFS=',' read -ra CONF_FILES <<< "$CONFIG_INPUT"
              for i in "${!CONF_FILES[@]}"; do CONF_FILES[$i]=$(echo "${CONF_FILES[$i]}" | xargs); done

              BASE_CONF="${CONF_FILES[0]}"
              MAKE_DEFCONFIG="vendor/xiaomi/$BASE_CONF"
              TARGET_CONFIG="$BASE_DIR/$MAKE_DEFCONFIG"
              
              for (( i=1; i<${#CONF_FILES[@]}; i++ )); do
                  FRAG="${CONF_FILES[$i]}"
                  TARGET_FRAG="$BASE_DIR/vendor/xiaomi/$FRAG"
                  if [ -f "$TARGET_FRAG" ]; then 
                      echo "📌 Merging file: $FRAG"
                      echo -e "\n$(cat "$TARGET_FRAG")" >> "$TARGET_CONFIG"
                  fi
              done
          else
              echo "⚙️ Mode Aktif: Single Config (arch/configs/)"
              CLEAN_CONF=$(echo "$CONFIG_INPUT" | xargs)
              MAKE_DEFCONFIG="$CLEAN_CONF"
              TARGET_CONFIG="$BASE_DIR/$MAKE_DEFCONFIG"
          fi

          echo "MAKE_DEFCONFIG=$MAKE_DEFCONFIG" >> $GITHUB_ENV
          echo "TARGET_CONFIG=$TARGET_CONFIG" >> $GITHUB_ENV
          
          # Bersihkan nama extraversion bawaan source
          sed -i 's/^EXTRAVERSION.*/EXTRAVERSION =/g' Makefile
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/g' "$TARGET_CONFIG" || true
          
          # Set Compiler String
          COMPILER_NAME=$(echo "${{ inputs.compiler }}" | awk -F'-' '{print toupper(substr($1,1,1)) substr($1,2) " Clang"}')
          RAW_CLANG_VER=$(clang --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || echo "Custom")
          RAW_LLD_VER=$(ld.lld --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || echo "$RAW_CLANG_VER")
          CUSTOM_COMPILER_STRING="${COMPILER_NAME:-Debian Clang} ${RAW_CLANG_VER} ✦ Pipeline: pgo • autofdo • bolt • propeller • thinlto • mlgo • polly • -o3 ✦ LLD ${RAW_LLD_VER}"
          echo "CUSTOM_COMPILER_STRING=$CUSTOM_COMPILER_STRING" >> $GITHUB_ENV
          sed -i 's|.*LINUX_COMPILER.*|echo \\#define LINUX_COMPILER \\"'"$CUSTOM_COMPILER_STRING"'\\"|g' scripts/mkcompile_h || true

          # ==========================================
          # 2. TWEAK .SH / .PATCH
          # ==========================================
          echo -e "\n=== 2. TWEAK SCRIPT / PATCH ==="
          process_custom_files "${{ inputs.custom_tweaks }}" "TWEAKS"
          
          # ==========================================
          # 3 & 4. CONFIG KSU & INSTALL KSU
          # ==========================================
          echo -e "\n=== 3 & 4. CONFIG & INSTALL KSU ==="
          KSU_CHOICE="${{ inputs.kernelsu }}"
          SUSFS_ENABLE="${{ inputs.susfs_enable }}"
          
          if [ "$KSU_CHOICE" == "none" ]; then
            echo "🧹 [ROOT] Skip instalasi Root (Mode: none)."
          elif [ "$KSU_CHOICE" == "apatch" ]; then
            echo "🧬 [APATCH] Menerapkan konfigurasi base APatch..."
            enable_cfg KALLSYMS KALLSYMS_ALL KALLSYMS_BASE_RELATIVE KPROBES HAVE_KPROBES
          else
            echo "🔑 [KSU] Menerapkan konfigurasi base KernelSU..."
            enable_cfg KSU
            
            case "$KSU_CHOICE" in
              xxksu)
                echo "🚀 [XXKSU] Instalasi fork xxksu..."
                curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
                disable_cfg KSU_KPROBES_KSUD
                ;;
              mambosu)
                echo "🚀 [MAMBOSU] Instalasi fork mambosu..."
                curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/master/kernel/setup.sh" | bash -s xxksu
                disable_cfg KSU_KPROBES_KSUD
                ;;
              rsuntk)
                echo "🚀 [RSUNTK] Instalasi fork rsuntk..."
                curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
                [[ "$SUSFS_ENABLE" != "true" ]] && enable_cfg KSU_MANUAL_HOOK
                ;;
              sukisu)
                echo "🚀 [SUKISU] Instalasi fork sukisu..."
                curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s old
                ;;
              next)
                echo "🚀 [NEXT] Instalasi fork KernelSU-Next (Legacy)..."
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/legacy/kernel/setup.sh" | bash -s legacy
                [[ "$SUSFS_ENABLE" != "true" ]] && enable_cfg KSU_MANUAL_HOOK
                ;;
              resukisu)
                echo "🚀 [RESUKISU] Instalasi fork ReSukiSU..."
                curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
                [[ "$SUSFS_ENABLE" != "true" ]] && enable_cfg KSU_MANUAL_HOOK
                ;;
              thre)
                echo "🚀 [THRE-NEXT] Instalasi fork Next (ThRE)..."
                curl -LSs https://raw.githubusercontent.com/ThRE-Team/KernelSU-Next/main/kernel/setup.sh | bash -s main
                enable_cfg KSU_MANUAL_HOOK
                disable_cfg KPROBES HAVE_KPROBES
                ;;
            esac
          fi
          
          # ==========================================
          # 5. HOOK SCRIPT .SH / .PATCH
          # ==========================================
          echo -e "\n=== 5. HOOK SCRIPT ==="
          process_custom_files "${{ inputs.custom_hooks }}" "HOOKS"

          # ==========================================
          # 6 & 7. SUSFS CONFIG & ENABLE
          # ==========================================
          echo -e "\n=== 6 & 7. SUSFS CONFIG & ENABLE ==="
          if [ "$SUSFS_ENABLE" == "true" ] && [ "$KSU_CHOICE" != "none" ] && [ "$KSU_CHOICE" != "apatch" ]; then
              echo "🛡️ [SUSFS] Mengaktifkan konfigurasi SuSFs..."
              enable_cfg KSU_SUSFS \
                         KSU_SUSFS_SUS_PATH \
                         KSU_SUSFS_SUS_MOUNT \
                         KSU_SUSFS_SUS_KSTAT \
                         KSU_SUSFS_SPOOF_UNAME \
                         KSU_SUSFS_ENABLE_LOG \
                         KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                         KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                         KSU_SUSFS_OPEN_REDIRECT \
                         KSU_SUSFS_SUS_MAP
              
              if grep -q "THREAD_INFO_IN_TASK" "drivers/kernelsu/Kconfig" 2>/dev/null; then
                  enable_cfg THREAD_INFO_IN_TASK
              fi
          else
              echo "⚠️ [SUSFS] Skip SuSFs (Opsi disable atau tidak mendukung)."
              disable_cfg KSU_SUSFS
          fi

          # ==========================================
          # 8. SUSFS SCRIPT .SH / .PATCH
          # ==========================================
          echo -e "\n=== 8. SUSFS SCRIPT ==="
          process_custom_files "${{ inputs.susfs_scripts }}" "SUSFS_SCRIPTS"

          # ==========================================
          # LTO CONFIGURATION (MANDIRI - JANGAN GABUNG EXTRA)
          # ==========================================
          echo -e "\n=== LTO CONFIG SETUP ==="
          disable_cfg LTO LTO_CLANG_FULL LTO_CLANG_THIN LTO_CLANG THINLTO LTO_NONE
          case "${{ inputs.lto_mode }}" in
            full) enable_cfg LTO LTO_CLANG LTO_CLANG_FULL ;;
            thin) enable_cfg LTO LTO_CLANG THINLTO LTO_CLANG_THIN ;;
            *) enable_cfg LTO_NONE ;;
          esac

          # ==========================================
          # 9. EXTRA CONFIG (POSISI MUTLAK PALING AKHIR)
          # ==========================================
          echo -e "\n=== 9. EXTRA CONFIG ==="
          EXTRA_CONFIG_INPUT="${{ inputs.extra_config }}"
          if [[ "$EXTRA_CONFIG_INPUT" != "none" && -n "$EXTRA_CONFIG_INPUT" ]]; then
              echo "⚙️ Menerapkan Extra Config (Final Override)..."
              IFS=',' read -ra EXTRAS <<< "$EXTRA_CONFIG_INPUT"
              for CFG in "${EXTRAS[@]}"; do
                  CFG=$(echo "$CFG" | xargs | tr '[:lower:]' '[:upper:]')
                  [[ -z "$CFG" ]] && continue
                  
                  CLEAN_CFG="${CFG#CONFIG_}"
                  
                  if [[ "$CLEAN_CFG" == *=N ]] || [[ "$CLEAN_CFG" == -* ]]; then
                      CLEAN_CFG="${CLEAN_CFG%=N}"
                      CLEAN_CFG="${CLEAN_CFG#-}"
                      echo "❌ Disable: CONFIG_$CLEAN_CFG"
                      disable_cfg "$CLEAN_CFG"
                  elif [[ "$CLEAN_CFG" == *=Y ]]; then
                      CLEAN_CFG="${CLEAN_CFG%=Y}"
                      echo "✅ Enable: CONFIG_$CLEAN_CFG"
                      enable_cfg "$CLEAN_CFG"
                  else
                      echo "✅ Enable: CONFIG_$CLEAN_CFG"
                      enable_cfg "$CLEAN_CFG"
                  fi
              done
          else
              echo "ℹ️ Extra config kosong (none). Skip."
          fi

      - name: Compile Kernel
        run: |
          # ==========================================
          # 10. COMPILE KERNEL
          # ==========================================
          cd kernel-dir
          export PATH=$HOME/tc/bin:$PATH
          export KBUILD_BUILD_USER="${{ inputs.project_name }}"
          export KBUILD_BUILD_HOST="project"
          export KBUILD_COMPILER_STRING="${{ env.CUSTOM_COMPILER_STRING }}"
          export LLVM_PARALLEL=1
          
          [[ "${{ inputs.version_hash }}" == "no hash" ]] && echo "" > .scmversion && export LOCALVERSION_AUTO="" || rm -f .scmversion
          rm -rf ../out && mkdir -p ../out
          
          # Copy target config ke arch/arm64/configs agar bisa di make
          BASENAME_CONFIG=$(basename "${{ env.MAKE_DEFCONFIG }}")
          if [ ! -f "arch/arm64/configs/$BASENAME_CONFIG" ]; then
            cp "${{ env.TARGET_CONFIG }}" "arch/arm64/configs/$BASENAME_CONFIG"
          fi
          
          make ARCH=arm64 O=../out "$BASENAME_CONFIG"
          
          EXTRA_CFLAGS=$([[ "${{ inputs.compiler }}" == "debian-clang" ]] && echo "--target=aarch64-linux-gnu" || echo "")
          OPTIMIZATION_FLAGS="-O3 -mcpu=cortex-a75 -mtune=cortex-a75 -falign-functions=64"
          
          CORES=$(nproc --all)
          MAKE_JOBS=$(( (CORES + 1) / 2 ))
          [[ "${{ inputs.lto_mode }}" == "full" ]] && MAKE_JOBS=2
          [[ "$MAKE_JOBS" -lt 2 ]] && MAKE_JOBS=2
          [[ "$MAKE_JOBS" -gt 8 ]] && MAKE_JOBS=8
          CLEAN_ROM=$(echo "${{ inputs.rom_type }}" | tr -d ' ')
          CLEAN_KERNEL=$(echo "${{ inputs.kernel_name }}" | tr -d ' ')
          echo "🚀 CPU Cores: $CORES | Used Jobs: $MAKE_JOBS"
          
          make -j$MAKE_JOBS ARCH=arm64 O=../out \
            LLVM=1 LLVM_IAS=1 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            LD=ld.lld HOSTLD=ld.lld \
            AR=llvm-ar HOSTAR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- \
            LOCALVERSION="-${CLEAN_KERNEL}-${CLEAN_ROM}" \
            KCFLAGS="$OPTIMIZATION_FLAGS -w -Qunused-arguments -Wno-error -fno-builtin -fomit-frame-pointer $EXTRA_CFLAGS" \
            Image.gz Image.gz-dtb dtbs 2>&1 | grep -vE "clang: warning:|ld.lld: warning:|Broken pipe|no symbols"
          
          if [ ! -s "../out/arch/arm64/boot/Image.gz" ] && [ ! -s "../out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ [ERROR] Kernel compilation failed." && exit 1
          else
            echo "✅ [SUCCESS] Kernel compilation successful."
          fi
          
      - name: Package with AnyKernel3
        run: |
          echo "📥 [FETCH] Mengkloning repositori AnyKernel3..."
          git clone --depth=1 ${{ inputs.anykernel-url }} AnyKernel3
          rm -rf AnyKernel3/{.git,.github,LICENSE,README.md,modules,patch,ramdisk,*.txt,*.md}
          KERNEL_DIR="out/arch/arm64/boot"
          
          echo "⚙️ [PROSES] Menyiapkan file kernel..."
          if [[ -f "$KERNEL_DIR/Image.gz" && -f "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" ]]; then
            echo "📦 [BUILD] Menggabungkan Image.gz dengan Beryllium DTB..."
            cat "$KERNEL_DIR/Image.gz" "$KERNEL_DIR/dts/qcom/sdm845-beryllium.dtb" > AnyKernel3/Image.gz-dtb
          else
            COMPRESSED_FOUND="false"
            for img in Image.gz-dtb Image-dtb Image.gz; do
              if [[ -f "$KERNEL_DIR/$img" ]]; then 
                echo "✅ [INFO] Ditemukan file $img, menyalin ke AnyKernel3..."
                cp "$KERNEL_DIR/$img" AnyKernel3/
                COMPRESSED_FOUND="true"
                break
              fi
            done
            
            if [[ "$COMPRESSED_FOUND" != "true" && -f "$KERNEL_DIR/Image" ]]; then
              echo "⚠️ [WARN] Image terkompresi tidak ditemukan!"
              echo "🗜️ [COMPRESS] Mengompres Image mentah ke Gzip secara manual (-9)..."
              gzip -n -9 < "$KERNEL_DIR/Image" > AnyKernel3/Image.gz
            fi
          fi
          
          if [[ -f "$KERNEL_DIR/dtbo.img" ]]; then
            echo "💾 [INFO] Ditemukan dtbo.img, menyalin ke AnyKernel3..."
            cp "$KERNEL_DIR/dtbo.img" AnyKernel3/
          fi
          
          rm -f AnyKernel3/*placeholder
          
          echo "🔍 [CEK] Memverifikasi hasil packaging AnyKernel3..."
          if ls AnyKernel3/Image* 1> /dev/null 2>&1; then
            echo "✨ [SUKSES] File kernel berhasil dipaketkan ke dalam folder AnyKernel3!"
          else
            echo "❌ [GAGAL] File Image kernel tidak ditemukan di folder AnyKernel3!"
            exit 1
          fi
          
          CLEAN_ZIP_NAME=$(echo "${{ inputs.zip_name }}" | tr ' ' '_')
          echo "FINAL_ARTIFACT_NAME=$CLEAN_ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.FINAL_ARTIFACT_NAME }}"
          path: AnyKernel3/
          compression-level: 9
          if-no-files-found: error
